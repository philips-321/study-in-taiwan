name: Discover Garbage Truck V2 Kaohsiung District Resources

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Recheck districts that already have a verified resource URL"
        required: true
        default: false
        type: boolean
      limit:
        description: "Maximum district pages to probe (0 = all missing-resource entries)"
        required: true
        default: "0"
        type: string
  push:
    paths:
      - 'garbage-truck/v2/.kaohsiung-resource-discovery-request.json'

permissions:
  contents: write

concurrency:
  group: garbage-truck-v2-kaohsiung-resource-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve bounded discovery request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            force='${{ inputs.force }}'
            limit='${{ inputs.limit }}'
          else
            readarray -t request < <(python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('garbage-truck/v2/.kaohsiung-resource-discovery-request.json').read_text(encoding='utf-8'))
          print('true' if d.get('force',False) else 'false')
          print(int(d.get('limit',8)))
          PY
            )
            force="${request[0]:-false}"
            limit="${request[1]:-8}"
          fi
          [[ "$limit" =~ ^[0-9]+$ ]] || { echo 'limit must be an integer' >&2; exit 1; }
          echo "force=$force" >> "$GITHUB_OUTPUT"
          echo "limit=$limit" >> "$GITHUB_OUTPUT"

      - name: Discover resource links from official data.gov.tw district pages
        shell: bash
        run: |
          set -euo pipefail
          args=(--limit '${{ steps.request.outputs.limit }}')
          if [[ '${{ steps.request.outputs.force }}' == 'true' ]]; then args+=(--force); fi
          python garbage-truck/v2/scripts/discover_kaohsiung_district_resources.py "${args[@]}"

      - name: Commit catalog metadata safely
        shell: bash
        run: |
          set -euo pipefail
          target='garbage-truck/v2/data/cities/kaohsiung/district-source-catalog.json'
          git add "$target"
          if git diff --cached --quiet; then echo 'No catalog changes.'; exit 0; fi
          git diff --cached --binary > /tmp/kaohsiung-resource-catalog.patch
          git reset --hard HEAD
          git fetch origin main
          git reset --hard origin/main
          git apply --index --3way /tmp/kaohsiung-resource-catalog.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'garbage-v2: refresh Kaohsiung district resource catalog'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
