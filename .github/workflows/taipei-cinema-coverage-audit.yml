name: Taipei cinema coverage audit

on:
  push:
    branches:
      - ops/taipei-cinema-through-20261207
    paths:
      - '.github/workflows/taipei-cinema-coverage-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Analyze saved Taipei cinema coverage only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, collections, datetime

          root = pathlib.Path('cinema/data')
          cinemas = json.loads((root/'cinemas/taipei.json').read_text())['cinemas']
          by_id = {c['id']: c for c in cinemas}
          start = datetime.date(2026,11,1)
          end = datetime.date(2026,12,7)
          daily = {cid: collections.Counter() for cid in by_id}
          sources = {cid: collections.Counter() for cid in by_id}
          first = {}
          latest = {}
          total = collections.Counter()
          unknown_ids = set()

          d = start
          while d <= end:
              p = root/'showtimes/by-date'/d.isoformat()/'taipei.json'
              if p.exists():
                  payload = json.loads(p.read_text())
                  for row in payload.get('showtimes', []):
                      cid = row.get('cinema_id')
                      if not cid:
                          continue
                      if cid not in by_id:
                          unknown_ids.add(cid)
                          continue
                      daily[cid][d.isoformat()] += 1
                      total[cid] += 1
                      sources[cid][row.get('source') or 'unknown'] += 1
                      first[cid] = min(first.get(cid, d), d)
                      latest[cid] = max(latest.get(cid, d), d)
              d += datetime.timedelta(days=1)

          rows = []
          for c in cinemas:
              cid = c['id']
              rows.append({
                  'cinema_id': cid,
                  'name_zh': c.get('name_zh'),
                  'name_en': c.get('name_en'),
                  'address': c.get('address'),
                  'operational_status': c.get('operational_status'),
                  'recommendation_eligible': c.get('recommendation_eligible'),
                  'status_evidence': c.get('status_evidence'),
                  'status_checked_at': c.get('status_checked_at'),
                  'saved_sessions_2026-11-01_to_2026-12-07': total[cid],
                  'first_saved_date_in_window': first.get(cid).isoformat() if cid in first else None,
                  'latest_saved_date_in_window': latest.get(cid).isoformat() if cid in latest else None,
                  'dates_with_saved_sessions': sorted(daily[cid]),
                  'daily_counts': dict(sorted(daily[cid].items())),
                  'sources': dict(sources[cid].most_common()),
              })

          out = pathlib.Path('audit-output')
          out.mkdir()
          result = {
              'window': {'start':'2026-11-01','end':'2026-12-07'},
              'cinema_records': len(cinemas),
              'unknown_cinema_ids_in_saved_rows': sorted(unknown_ids),
              'cinemas': rows,
          }
          (out/'taipei-coverage.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')

          md = ['# Taipei cinema saved coverage audit', '', 'Window: 2026-11-01 through 2026-12-07.', '', '| Cinema | Status | Sessions | First | Latest | Sources |', '|---|---|---:|---|---|---|']
          for r in rows:
              src = ', '.join(f'{k}:{v}' for k,v in r['sources'].items()) or '—'
              md.append(f"| {r['name_zh']} | {r['operational_status'] or 'unknown'} | {r['saved_sessions_2026-11-01_to_2026-12-07']} | {r['first_saved_date_in_window'] or '—'} | {r['latest_saved_date_in_window'] or '—'} | {src} |")
          (out/'taipei-coverage.md').write_text('\n'.join(md)+'\n')
          print('\n'.join(md))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: taipei-cinema-coverage-audit-${{ github.run_id }}
          path: audit-output/
          retention-days: 14
