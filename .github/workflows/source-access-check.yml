name: RTI Discovery Endpoint Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-access-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check a few RTI discovery endpoints
        shell: bash
        run: |
          python - <<'PY'
          import requests, re
          from bs4 import BeautifulSoup

          targets = [
              ("RSS", "https://www.rti.org.tw/rss"),
              ("Sitemap", "https://www.rti.org.tw/sitemap.xml"),
              ("Robots", "https://www.rti.org.tw/robots.txt"),
          ]
          headers = {"User-Agent":"Mozilla/5.0","Accept-Language":"zh-TW,zh;q=0.9"}
          for name, url in targets:
              try:
                  r = requests.get(url, headers=headers, timeout=20, allow_redirects=True)
                  print(f"=== {name} ===")
                  print(f"status={r.status_code} len={len(r.content)} final={r.url}")
                  text = r.text[:120000]
                  if r.status_code == 200:
                      soup = BeautifulSoup(text, "html.parser")
                      pairs = []
                      for a in soup.find_all("a", href=True):
                          title = " ".join(a.stripped_strings)
                          href = a.get("href","")
                          if title and ("news" in href or "pid=" in href):
                              pairs.append((title, href))
                          if len(pairs) >= 3:
                              break
                      for title, href in pairs:
                          print("TITLE:", title[:140])
                          print("URL:", href)
                      if not pairs:
                          urls = re.findall(r'https?://[^\s<>"\']+', text)
                          for u in urls[:3]:
                              print("URLONLY:", u[:220])
              except Exception as e:
                  print(f"{name} ERROR {type(e).__name__}: {e}")
          PY
