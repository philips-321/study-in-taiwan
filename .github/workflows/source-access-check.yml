name: RTI Discovery Endpoint Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-access-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check a few RTI discovery endpoints
        shell: bash
        run: |
          python - <<'PY'
          import requests, re, html

          targets = [
              ("RSS", "https://www.rti.org.tw/rss"),
              ("Sitemap", "https://www.rti.org.tw/sitemap.xml"),
              ("Robots", "https://www.rti.org.tw/robots.txt"),
          ]
          headers = {"User-Agent":"Mozilla/5.0","Accept-Language":"zh-TW,zh;q=0.9"}

          for name, url in targets:
              try:
                  r = requests.get(url, headers=headers, timeout=20, allow_redirects=True)
                  print(f"=== {name} ===")
                  print(f"status={r.status_code} len={len(r.content)} final={r.url}")
                  text = r.text[:150000]
                  if r.status_code == 200:
                      news_urls = re.findall(r'https?://[^\s<>"\']*(?:/news[^\s<>"\']*|pid=\d+[^\s<>"\']*)', text)
                      seen = []
                      for u in news_urls:
                          u = html.unescape(u)
                          if u not in seen:
                              seen.append(u)
                          if len(seen) >= 3:
                              break
                      for u in seen:
                          print("NEWS_URL:", u[:240])

                      titles = re.findall(r'<title>(.*?)</title>|<loc>(.*?)</loc>', text, flags=re.I|re.S)
                      shown = 0
                      for a,b in titles:
                          val = re.sub(r'<[^>]+>', '', a or b).strip()
                          if val:
                              print("TITLE_OR_LOC:", html.unescape(val)[:240])
                              shown += 1
                          if shown >= 3:
                              break
              except Exception as e:
                  print(f"{name} ERROR {type(e).__name__}: {e}")
          PY
