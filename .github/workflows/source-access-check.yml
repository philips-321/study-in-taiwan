name: Source Access Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-access-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check source HTTP access
        shell: bash
        run: |
          python - <<'PY'
          import requests
          targets = [
              ("RTI", "https://www.rti.org.tw/news"),
              ("CNA", "https://www.cna.com.tw/"),
              ("Bloomberg home", "https://www.bloomberg.com/"),
              ("Bloomberg markets", "https://www.bloomberg.com/markets"),
              ("Reuters", "https://www.reuters.com/"),
          ]
          headers = {
              "User-Agent": "Mozilla/5.0 (compatible; source-access-check/1.0)",
              "Accept-Language": "en-US,en;q=0.9,zh-TW;q=0.7",
          }
          for name, url in targets:
              try:
                  r = requests.get(url, headers=headers, timeout=20, allow_redirects=True)
                  print(f"{name}\tstatus={r.status_code}\tlen={len(r.content)}\tfinal={r.url}")
              except Exception as e:
                  print(f"{name}\tERROR\t{type(e).__name__}: {e}")
          PY
