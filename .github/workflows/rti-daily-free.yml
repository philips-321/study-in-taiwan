name: RTI Daily News - Zero Payment

on:
  workflow_dispatch:
    inputs:
      max_articles:
        description: "Number of RTI articles to generate (1-20)"
        required: false
        default: "3"

# Daily schedule is intentionally disabled until the model benchmark is completed
# and the user explicitly selects the production model.
permissions:
  contents: write

concurrency:
  group: rti-daily-free
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_AI_MODEL: ${{ vars.RTI_AI_MODEL || '@cf/zai-org/glm-4.7-flash' }}
      MAX_ARTICLES: ${{ inputs.max_articles }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/rti_free/requirements.txt

      - name: Install generator dependencies
        run: pip install -r automation/rti_free/requirements.txt

      - name: Verify required Cloudflare secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Generate RTI study page
        run: python automation/rti_free/generate.py

      - name: Commit generated page and index
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/
          git commit -m "news: generate RTI study page $(TZ=Asia/Taipei date +%F)"
          git push
