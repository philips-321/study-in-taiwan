name: Refresh Garbage Truck V2 City

on:
  workflow_dispatch:
    inputs:
      city:
        description: "Refresh one city/county only"
        required: true
        type: choice
        options:
          - taipei
          - new-taipei
          - taoyuan
          - taichung
          - tainan
          - kaohsiung
          - keelung
          - hsinchu-city
          - chiayi-city
          - yilan
          - hsinchu-county
          - miaoli
          - changhua
          - nantou
          - yunlin
          - chiayi-county
          - pingtung
          - hualien
          - taitung
          - penghu
          - kinmen
          - lienchiang
      force:
        description: "Override unchanged-source or Monday cooldown checks"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: garbage-truck-v2-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check preferred source and refresh one city/county
        id: collect
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          force=()
          if [[ "${{ inputs.force }}" == "true" ]]; then force+=(--force); fi
          if [[ "${{ inputs.city }}" == "tainan" ]]; then
            echo "Using Tainan City Government official JSON source."
            python garbage-truck/v2/scripts/import_tainan.py "${force[@]}"
          else
            echo "Using MOENV nationwide fallback until a verified local official adapter is available."
            python garbage-truck/v2/scripts/collect_moenv.py --city "${{ inputs.city }}" "${force[@]}"
          fi

      - name: Compile mapped stops to small JSON tiles
        if: steps.collect.outcome == 'success'
        run: python garbage-truck/v2/scripts/compile_tiles.py --city "${{ inputs.city }}"

      - name: Commit published JSON or source-check metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          path="garbage-truck/v2/data/cities/${{ inputs.city }}"
          if [[ ! -e "$path" ]]; then echo "No city data/metadata directory created."; exit 0; fi
          git add "$path"
          if git diff --cached --quiet; then echo "No static JSON or source metadata changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "garbage-v2: refresh/check ${{ inputs.city }} source"
          git push

      - name: Mark upstream failure after metadata is preserved
        if: steps.collect.outcome == 'failure'
        run: |
          echo "Collector/importer stopped after its two-attempt upstream policy. Source metadata was preserved; next normal retry is Monday."
          exit 1
