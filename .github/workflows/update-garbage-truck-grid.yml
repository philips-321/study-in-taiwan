name: Update garbage truck geo-grid

on:
  workflow_dispatch:
  push:
    branches:
      - garbage-truck-grid
    paths:
      - "garbage-truck/scripts/build-taipei-grid.py"
      - ".github/workflows/update-garbage-truck-grid.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Taipei geo-grid
        run: python3 garbage-truck/scripts/build-taipei-grid.py

      - name: Validate generated files
        run: |
          test -s garbage-truck/data/manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('garbage-truck/data/manifest.json').read_text())
          assert m.get('tiles') and m.get('total_rows', 0) >= 1000
          print(m['total_rows'], len(m['tiles']))
          PY

      - name: Commit generated grid
        run: |
          if git diff --quiet -- garbage-truck/data; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "garbage-truck-data-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add garbage-truck/data
          git commit -m "Update Taipei garbage truck geo-grid [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
