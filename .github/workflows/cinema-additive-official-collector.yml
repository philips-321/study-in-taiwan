name: Taipei additive official collector (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cinema-additive-official-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Chromium for 403 fallback
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Unit tests and baseline validation
        run: |
          set -euo pipefail
          node --check cinema/scripts/refresh-direct-official-sources.mjs
          node --check cinema/cinema.js
          node --test cinema/tests/additive-screening-merge.test.mjs
          node --check cinema/scripts/audit-language-coverage.mjs
          node cinema/scripts/validate-canonical-data.mjs
          node cinema/scripts/validate-canonical-movie-registry.mjs
      - name: Test live official sources without writes
        run: |
          set -euo pipefail
          node cinema/scripts/refresh-direct-official-sources.mjs --additive --dry-run --source=all | tee /tmp/cinema-probe.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('/tmp/cinema-probe.json','utf8'));
          if (!p.dry_run || !p.additive) throw Error('Incorrect collector mode');
          const successes=Object.values(p.sources||{}).filter(s=>s.ok);
          if (!successes.length) throw Error('No successful official sources');
          if (successes.some(s=>s.rows<=0)) throw Error('Empty successful source');
          console.log('Official-source probe passed:',successes.length);
          NODE
          git diff --exit-code -- cinema/data
      - name: Collect additively, validate, and check historical preservation
        run: |
          set -euo pipefail
          node cinema/scripts/refresh-direct-official-sources.mjs --additive --source=all
          node cinema/scripts/validate-canonical-data.mjs
          node cinema/scripts/audit-language-coverage.mjs --write > /tmp/cinema-language-coverage.json
          # The additive collector adds films to movies/index.json. Keep the canonical
          # movie registry in sync before validating and committing either dataset.
          CINEMA_MAX_POSTER_LOOKUPS=0 CINEMA_MAX_OFFICIAL_POSTER_LOOKUPS=0 node cinema/scripts/sync-canonical-movie-registry.mjs
          node cinema/scripts/validate-canonical-movie-registry.mjs
          python3 - <<'PY'
          import json,subprocess,pathlib
          base='cinema/data/showtimes/by-date/'
          old=subprocess.check_output(['git','ls-tree','-r','--name-only','HEAD','cinema/data/showtimes/by-date'],text=True).splitlines()
          checked=0
          for file in old:
              if not file.endswith('/taipei.json'): continue
              before=json.loads(subprocess.check_output(['git','show',f'HEAD:{file}'],text=True))['showtimes']
              p=pathlib.Path(file)
              if not p.exists(): raise SystemExit(f'Deleted historical file: {file}')
              after=json.loads(p.read_text())['showtimes']
              # Existing rows may only gain previously absent verified language facts.
              # Every other field, including provenance, must remain unchanged.
              def identity(row):
                  return (row.get('cinema_id'),row.get('movie_id'),row.get('start_time'),row.get('hall'),row.get('format'))
              after_by_key={}
              for row in after: after_by_key.setdefault(identity(row),[]).append(row)
              for old in before:
                  candidates=after_by_key.get(identity(old),[])
                  def safe_upgrade(new):
                      for field,value in old.items():
                          if field in ('audio_language','subtitles') and (value is None or value == []):
                              continue
                          if new.get(field)!=value: return False
                      for field in ('audio_language','subtitles'):
                          if field not in old and field in new and not new[field]: return False
                      return True
                  found=next((i for i,new in enumerate(candidates) if safe_upgrade(new)),None)
                  if found is None: raise SystemExit(f'Historical screening removed or language regressed: {file}, {identity(old)}')
                  candidates.pop(found)
              checked+=1
          print('Historical screening preservation PASS:',checked,'Taipei chunks')
          PY
          git diff --check
      - name: Commit only validated cinema data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cinema/data
          if git diff --cached --quiet; then
            echo 'No data changes'
            exit 0
          fi
          git commit -m 'data(cinema): validated additive official refresh [skip ci]'
          # Documentation commits may land while a scheduled collection runs.
          # Rebase on the latest main instead of force-pushing or losing data.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
