name: Probe Garbage Truck V2 Yilan Source

on:
  push:
    paths:
      - 'garbage-truck/v2/.yilan-probe-request.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garbage-truck-v2-yilan-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official Yilan source shape
        run: python garbage-truck/v2/scripts/probe_yilan.py
      - name: Commit source-shape metadata safely
        shell: bash
        run: |
          set -euo pipefail
          target='garbage-truck/v2/data/cities/yilan/source-probe.json'
          test -f "$target"
          git add "$target"
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --binary > /tmp/yilan-probe.patch
          git reset --hard HEAD
          git fetch origin main
          git reset --hard origin/main
          git apply --index --3way /tmp/yilan-probe.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'garbage-v2: record Yilan official source shape'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
