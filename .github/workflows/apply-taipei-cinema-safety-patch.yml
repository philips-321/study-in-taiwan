name: Apply Taipei cinema safety patch

on:
  push:
    branches:
      - ops/taipei-cinema-through-20261207
    paths:
      - '.github/workflows/apply-taipei-cinema-safety-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-import-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ops/taipei-cinema-through-20261207
          fetch-depth: 5

      - name: Patch non-destructive validation and Dec 7 display horizon
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          validator = Path('cinema/scripts/validate-canonical-data.mjs')
          text = validator.read_text()
          old = "assert.equal(references.size, movieIds.size, 'Unreferenced catalog films');"
          new = "assert(movieIds.size >= references.size, 'Movie catalog cannot be smaller than referenced film set');"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('validator target not found')
          validator.write_text(text)

          app = Path('cinema/cinema.js')
          text = app.read_text()
          old = "availableDates=Object.keys(showtimesDateIndex).filter(x=>/^\\d{4}-\\d{2}-\\d{2}$/.test(x)&&x>=today).sort();"
          new = "const maxDisplayDate='2026-12-07'; availableDates=Object.keys(showtimesDateIndex).filter(x=>/^\\d{4}-\\d{2}-\\d{2}$/.test(x)&&x>=today&&x<=maxDisplayDate).sort();"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('cinema.js date-filter target not found')
          app.write_text(text)
          PY

      - name: Import Hala official browser snapshot incrementally
        run: node cinema/scripts/import-taipei-browser-tsv.mjs cinema/data/research/snapshots/2026-11-01/hala-official.tsv

      - name: Validate canonical cinema data
        run: node cinema/scripts/validate-canonical-data.mjs

      - name: Verify no dates after Dec 7 were deleted from storage
        shell: bash
        run: |
          set -euo pipefail
          test -f cinema/data/showtimes/by-date/2026-12-16/taipei.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('cinema/data/manifest.json','utf8'));
          if (manifest.display_policy?.max_date !== '2026-12-07') throw new Error('Missing Dec 7 display cutoff');
          const catalog = JSON.parse(fs.readFileSync('cinema/data/movies/index.json','utf8'));
          if (!catalog.movies?.length) throw new Error('Movie catalog unexpectedly empty');
          console.log(JSON.stringify({display_policy:manifest.display_policy,catalog_movies:catalog.movies.length,taipei_showtimes:manifest.cities?.taipei?.showtimes},null,2));
          NODE

      - name: Commit validated incremental update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cinema-data-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add cinema/cinema.js cinema/scripts/validate-canonical-data.mjs cinema/data
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Add Hala Taipei schedules without deleting cinema history [skip ci]'
          git push origin HEAD:ops/taipei-cinema-through-20261207
