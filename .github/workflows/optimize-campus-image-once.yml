name: Optimize campus image once

on:
  push:
    paths:
      - '.github/workflows/optimize-campus-image-once.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build optimized WebP from original PNG
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path('images/taiwan-campus.png')
          out = Path('images/taiwan-campus.webp')
          index = Path('index.html')

          with Image.open(src) as original:
              image = original.convert('RGB')
              original_size = image.size
              if image.width > 1600:
                  height = round(image.height * 1600 / image.width)
                  image = image.resize((1600, height), Image.Resampling.LANCZOS)
              image.save(out, 'WEBP', quality=90, method=6)
              print(f'Original dimensions: {original_size[0]}x{original_size[1]}')
              print(f'Web dimensions: {image.width}x{image.height}')

          html = index.read_text(encoding='utf-8')
          old = '        <img src="images/taiwan-campus.png" alt="International students on a university campus in Taiwan" />'
          new = '''        <picture>\n          <source srcset="images/taiwan-campus.webp" type="image/webp" />\n          <img src="images/taiwan-campus.png" alt="International students on a university campus in Taiwan" loading="lazy" decoding="async" />\n        </picture>'''
          if old not in html:
              raise SystemExit('Expected campus image markup not found; refusing to modify index.html')
          index.write_text(html.replace(old, new, 1), encoding='utf-8')

          print(f'Original PNG bytes: {src.stat().st_size}')
          print(f'Optimized WebP bytes: {out.stat().st_size}')
          PY

      - name: Commit optimized asset and homepage reference
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/taiwan-campus.webp index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'perf: optimize homepage campus photo'
            git push
          fi
