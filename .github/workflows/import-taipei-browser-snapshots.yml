name: Import reviewed Taipei cinema snapshots

on:
  push:
    branches:
      - main
      - ops/taipei-cinema-through-20261207
    paths:
      - 'cinema/data/research/snapshots/**/*.tsv'
  workflow_dispatch:

concurrency:
  group: taipei-cinema-reviewed-snapshot-import-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 5
      - name: Import every reviewed Taipei snapshot
        shell: bash
        run: |
          set -euo pipefail
          find cinema/data/research/snapshots -type f -name '*.tsv' -print0 | sort -z |
          while IFS= read -r -d '' snapshot; do
            echo "Importing $snapshot"
            node cinema/scripts/import-taipei-browser-tsv.mjs "$snapshot"
          done
      - name: Validate canonical data
        run: node cinema/scripts/validate-canonical-data.mjs
      - name: Verify history and display cutoff
        shell: bash
        run: |
          set -euo pipefail
          test -f cinema/data/showtimes/by-date/2026-12-16/taipei.json
          grep -q "availableDates=Object.keys(showtimesDateIndex)" cinema/cinema.js
      - name: Commit reviewed snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cinema-data-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add cinema/data
          if git diff --cached --quiet; then
            echo 'No data changes.'
            exit 0
          fi
          git commit -m 'Import reviewed Taipei cinema snapshots [skip ci]'
          git push origin HEAD:"$GITHUB_REF_NAME"
