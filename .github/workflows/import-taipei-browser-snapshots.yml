name: Import reviewed Taipei cinema snapshots

on:
  push:
    branches:
      - main
      - ops/taipei-cinema-through-20261207
    paths:
      - 'cinema/data/research/snapshots/**/*.tsv'
  workflow_dispatch:

concurrency:
  group: taipei-cinema-reviewed-snapshot-import-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 5
      - name: Import every reviewed Taipei snapshot
        shell: bash
        run: |
          set -euo pipefail
          find cinema/data/research/snapshots -type f -name '*.tsv' -print0 | sort -z |
          while IFS= read -r -d '' snapshot; do
            echo "Importing $snapshot"
            node cinema/scripts/import-taipei-browser-tsv.mjs "$snapshot"
          done
      - name: Merge reviewed rows into canonical archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cinema-reviewed-canonical
          node cinema/scripts/convert-to-canonical.mjs --output-root=/tmp/cinema-reviewed-canonical
          node cinema/scripts/merge-canonical-snapshot.mjs /tmp/cinema-reviewed-canonical/canonical --previous-movies=cinema/data/movies/index.json
      - name: Update unique canonical film poster status and fetch missing posters
        env:
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: node cinema/scripts/sync-canonical-movie-registry.mjs
      - name: Rebuild public view from canonical archive
        shell: bash
        run: |
          set -euo pipefail
          as_of="$(TZ=Asia/Taipei date +%F)"
          rm -rf /tmp/cinema-reviewed-public
          node cinema/scripts/materialize-public-window.mjs --canonical-root=cinema/data/canonical --output-root=/tmp/cinema-reviewed-public --as-of="$as_of" --days=30
          rm -rf cinema/data/showtimes-public
          mkdir -p cinema/data/showtimes-public
          cp -a /tmp/cinema-reviewed-public/. cinema/data/showtimes-public/
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'cinema/data/canonical/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          const view = JSON.parse(fs.readFileSync('cinema/data/showtimes-public/manifest.json', 'utf8'));
          manifest.public_view = {
            window_days: view.days,
            generated_as_of: view.as_of,
            rows: view.public_rows,
            excluded_by_window: view.excluded_by_window,
            sha256: view.sha256
          };
          fs.writeFileSync(file, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
      - name: Write source, matching, poster, and ID health report
        run: node cinema/scripts/write-automation-health-report.mjs
      - name: Validate canonical data
        run: node cinema/scripts/validate-canonical-data.mjs
      - name: Validate canonical movie poster registry
        run: node cinema/scripts/validate-canonical-movie-registry.mjs
      - name: Verify history and display cutoff
        shell: bash
        run: |
          set -euo pipefail
          test -f cinema/data/showtimes/by-date/2026-12-16/taipei.json
          grep -q "availableDates=Object.keys(showtimesDateIndex)" cinema/cinema.js
      - name: Commit reviewed snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cinema-data-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add cinema/data
          if git diff --cached --quiet; then
            echo 'No data changes.'
            exit 0
          fi
          git commit -m 'Import reviewed Taipei cinema snapshots [skip ci]'
          git push origin HEAD:"$GITHUB_REF_NAME"
