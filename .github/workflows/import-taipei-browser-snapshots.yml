name: Import Taipei browser snapshots

on:
  push:
    branches: [ops/taipei-cinema-through-20261207]
    paths:
      - '.github/workflows/import-taipei-browser-snapshots.yml'
      - 'cinema/data/research/snapshots/**/*.tsv'
  workflow_dispatch:

concurrency:
  group: taipei-cinema-browser-snapshot-import
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ops/taipei-cinema-through-20261207
          fetch-depth: 5
      - name: Import every reviewed Taipei snapshot
        shell: bash
        run: |
          set -euo pipefail
          find cinema/data/research/snapshots -type f -name '*.tsv' -print0 | sort -z |
          while IFS= read -r -d '' snapshot; do
            echo "Importing $snapshot"
            node cinema/scripts/import-taipei-browser-tsv.mjs "$snapshot"
          done
      - name: Validate canonical data
        run: node cinema/scripts/validate-canonical-data.mjs
      - name: Verify history and display cutoff
        run: |
          set -euo pipefail
          test -f cinema/data/showtimes/by-date/2026-12-16/taipei.json
          grep -q "maxDisplayDate='2026-12-07'" cinema/cinema.js
      - name: Report Taipei coverage through Dec 7
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const cinemas=JSON.parse(fs.readFileSync('cinema/data/cinemas/taipei.json','utf8')).cinemas;
          const counts=new Map(cinemas.map(c=>[c.id,0]));
          const latest=new Map();
          const start='2026-11-01', end='2026-12-07';
          const root='cinema/data/showtimes/by-date';
          for(const date of fs.readdirSync(root).filter(d=>d>=start&&d<=end).sort()){
            const f=path.join(root,date,'taipei.json'); if(!fs.existsSync(f)) continue;
            for(const r of JSON.parse(fs.readFileSync(f,'utf8')).showtimes||[]){
              if(!counts.has(r.cinema_id)) continue;
              counts.set(r.cinema_id,counts.get(r.cinema_id)+1); latest.set(r.cinema_id,date);
            }
          }
          console.log('=== TAIPEI_COVERAGE_FINAL ===');
          for(const c of cinemas) console.log([c.id,c.name_zh,c.operational_status||'unknown',counts.get(c.id)||0,latest.get(c.id)||'-'].join('\t'));
          console.log('=== ZERO_ROWS ===');
          for(const c of cinemas.filter(c=>(counts.get(c.id)||0)===0)) console.log([c.id,c.name_zh,c.operational_status||'unknown',c.address].join('\t'));
          NODE
      - name: Commit reviewed snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cinema-data-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add cinema/data
          if git diff --cached --quiet; then
            echo 'No data changes.'
            exit 0
          fi
          git commit -m 'Import reviewed Taipei cinema browser snapshots [skip ci]'
          git push origin HEAD:ops/taipei-cinema-through-20261207
