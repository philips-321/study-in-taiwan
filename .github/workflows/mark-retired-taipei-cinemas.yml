name: Mark retired Taipei cinemas

on:
  push:
    branches: [ops/taipei-cinema-through-20261207]
    paths: ['.github/workflows/mark-retired-taipei-cinemas.yml']

permissions:
  contents: write

jobs:
  mark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ops/taipei-cinema-through-20261207
          fetch-depth: 5
      - name: Mark only externally verified closures
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='cinema/data/cinemas/taipei.json';
          const doc=JSON.parse(fs.readFileSync(file,'utf8'));
          const closures=new Map([
            ['fb49c0eb0cd2b7cd', {
              closed_on:'2026-01-31',
              evidence:'https://www.mirrormedia.mg/story/20260105edi043',
              note:'New Minshen Cinema announced permanent closure effective 2026-01-31.'
            }],
            ['b311f3204b81a053', {
              closed_on:'2026-05-31',
              evidence:'https://www.cna.com.tw/news/amov/202605200262.aspx',
              note:'Duplicate/company master record for the Ximending in89 physical venue at Wuchang St. Sec. 2 No. 89; venue ended operations 2026-05-31.'
            }],
            ['80090ba98f0571f6', {
              closed_on:'2026-05-31',
              evidence:'https://www.cna.com.tw/news/amov/202605200262.aspx',
              note:'Taipei Ximending in89 physical venue ended operations 2026-05-31.'
            }]
          ]);
          let changed=0;
          for(const cinema of doc.cinemas||[]){
            const info=closures.get(cinema.id); if(!info) continue;
            cinema.operational_status='closed';
            cinema.recommendation_eligible=false;
            cinema.status_evidence='verified-permanent-closure';
            cinema.status_checked_at='2026-11-01T00:00:00+08:00';
            cinema.closed_on=info.closed_on;
            cinema.closure_evidence_url=info.evidence;
            cinema.closure_note=info.note;
            changed++;
          }
          if(changed!==closures.size) throw new Error(`Expected ${closures.size} closure records, changed ${changed}`);
          fs.writeFileSync(file,JSON.stringify(doc,null,2)+'\n');
          console.log(`Marked ${changed} retired Taipei cinema records closed; no records or historical showtimes deleted.`);
          NODE
      - name: Validate canonical cinema data
        run: node cinema/scripts/validate-canonical-data.mjs
      - name: Ensure historical data and future stored rows remain
        shell: bash
        run: |
          set -euo pipefail
          test -f cinema/data/showtimes/by-date/2026-12-16/taipei.json
          grep -q '2026-12-07' cinema/cinema.js
      - name: Commit closure status only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cinema-data-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add cinema/data/cinemas/taipei.json
          git commit -m 'Mark verified retired Taipei cinemas closed [skip ci]'
          git push origin HEAD:ops/taipei-cinema-through-20261207
