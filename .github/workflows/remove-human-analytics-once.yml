name: Remove legacy human analytics references once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-human-analytics-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove human analytics callers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          exts = {'.html', '.js', '.mjs', '.cjs'}
          script_re = re.compile(
              r'\s*<script\b[^>]*\bsrc=["\']/human-analytics\.js["\'][^>]*>\s*</script>',
              re.I,
          )

          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in exts:
                  continue
              try:
                  old = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = script_re.sub('', old)
              if new != old:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          leftovers = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if 'human-analytics' in text or 'humanAnalytics' in text or 'data-human-analytics' in text:
                  leftovers.append(str(path))

          print(f'Changed {len(changed)} file(s)')
          for path in changed:
              print(f'- {path}')
          if leftovers:
              print('Leftover references:')
              for path in leftovers:
                  print(f'- {path}')
              raise SystemExit(1)
          PY

      - name: Remove one-shot workflow and commit cleanup
        shell: bash
        run: |
          rm -f .github/workflows/remove-human-analytics-once.yml
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove legacy human analytics references [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
