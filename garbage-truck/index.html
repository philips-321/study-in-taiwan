<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taiwan Garbage Truck Map | Study in Taiwan</title><meta name="description" content="Find Taipei garbage truck pickup times on a map. Browse without Mandarin search forms, or use your location to find nearby pickup points."><link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#fff}#app{height:100%;display:grid;grid-template-rows:auto 1fr}header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid #ddd;background:#fff;z-index:3}.brand{font-weight:700;margin-right:auto}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:9px 11px;border:1px solid #bbb;border-radius:9px;background:#fff}button{cursor:pointer}#status{font-size:13px;color:#555;flex-basis:100%}#content{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px}#map{min-height:520px}#panel{overflow:auto;border-left:1px solid #ddd;background:#fff;padding:12px}#panel h2{font-size:17px;margin:0 0 4px}.hint{font-size:12px;color:#666;margin-bottom:8px}.place-card{border-top:1px solid #eee;padding:10px 0}.place-card:first-of-type{border-top:0}.addr{font-size:13px;font-weight:700;line-height:1.35}.meta{font-size:12px;color:#666;margin-top:3px}.times{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.chip{font-size:12px;border:1px solid #ccc;border-radius:999px;padding:3px 7px;background:#f7f7f7}.chip.now{background:#111;color:#fff;border-color:#111}.chip.next{background:#e9eefc;border-color:#99aef5}.glink{display:inline-block;margin-top:6px;font-size:12px;text-decoration:none}.time-marker{background:#111;color:#fff;padding:3px 6px;border-radius:6px;font:bold 12px/1.1 sans-serif;white-space:nowrap;border:1px solid #fff;box-shadow:0 1px 4px #0004}.user-dot{width:18px;height:18px;border-radius:50%;background:#1677ff;border:3px solid #fff;box-shadow:0 0 0 2px #1677ff}.popup-times{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.popup-chip{background:#eee;border-radius:999px;padding:2px 6px;font-size:12px}@media(max-width:800px){#content{grid-template-columns:1fr;grid-template-rows:minmax(430px,62vh) auto}#panel{border-left:0;border-top:1px solid #ddd}}</style></head><body><div id="app"><header><div class="brand">Garbage Truck Map</div><div class="controls"><button id="locate">Use my location</button><select id="lang" aria-label="Language"><option value="en">English</option><option value="id">Indonesia</option></select></div><div id="status">Loading Taipei garbage truck data…</div></header><div id="content"><div id="map"></div><aside id="panel"><h2 id="panelTitle">Visible pickup locations</h2><div class="hint" id="hint">Only schedules that have not finished yet are shown. GPS is optional.</div><div id="list">Loading…</div></aside></div></div><script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script><script>const API='https://data.taipei/opendata/datalist/apiAccess?scope=resourceAquire&rid=a6e90031-7ec4-4089-afb5-361a4efe7202';let DATA=[];const T={en:{locate:'Use my location',panel:'Visible pickup locations',hint:'Only schedules that have not finished yet are shown. GPS is optional.',intro:'Move or zoom the map. Only visible pickup points are rendered.',browse:'Move the map to browse Taipei.',noStops:'No remaining pickup schedules in this viewport.',openMaps:'Google Maps ↗',fromYou:'m from you',remaining:'remaining schedule',remainingPlural:'remaining schedules',visible:'visible locations',expired:'expired schedules hidden',sorted:'sorted by distance from you',getting:'Getting your location…',blocked:'Location blocked by browser. You can still browse the map manually.',unsupported:'Geolocation unsupported.',now:'NOW',loadError:'Could not load Taipei data.'},id:{locate:'Gunakan lokasi saya',panel:'Titik pengambilan yang terlihat',hint:'Hanya jadwal yang belum selesai yang ditampilkan. GPS tidak wajib.',intro:'Geser atau zoom peta. Hanya titik yang terlihat yang dirender.',browse:'Geser peta untuk menjelajahi Taipei.',noStops:'Tidak ada jadwal yang masih aktif di area peta ini.',openMaps:'Google Maps ↗',fromYou:'m dari Anda',remaining:'jadwal tersisa',remainingPlural:'jadwal tersisa',visible:'lokasi terlihat',expired:'jadwal lewat disembunyikan',sorted:'diurutkan berdasarkan jarak dari Anda',getting:'Mengambil lokasi Anda…',blocked:'Akses lokasi diblokir browser. Peta tetap bisa digunakan manual.',unsupported:'Browser tidak mendukung geolokasi.',now:'SEKARANG',loadError:'Data Taipei tidak bisa dimuat.'}};let lang='en';const statusEl=document.getElementById('status'),listEl=document.getElementById('list');const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[121.5319,25.0478],zoom:12.4});map.addControl(new maplibregl.NavigationControl(),'top-left');let markers=[],userMarker=null,userPos=null;function num(v){return Number(String(v??'').replace(',','').trim())}function toMin(v){let s=String(v??'').replace(':','').padStart(4,'0');return Number(s.slice(0,2))*60+Number(s.slice(2,4))}function hhmm(v){let s=String(v??'').replace(':','').padStart(4,'0');return s.slice(0,2)+':'+s.slice(2,4)}function normalize(x){return{place:x['地點'],lng:num(x['經度']),lat:num(x['緯度']),arrival:hhmm(x['抵達時間']),departure:hhmm(x['離開時間']),arrivalMin:toMin(x['抵達時間']),departureMin:toMin(x['離開時間'])}}function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes()}function distM(a,b,c,d){const R=6371000,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p,q=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function gmaps(x){return`https://www.google.com/maps/search/?api=1&query=${x.lat},${x.lng}`}function clearMarkers(){markers.forEach(m=>m.remove());markers=[]}function visibleGroups(){const b=map.getBounds(),now=nowMin(),groups=new Map();for(const x of DATA){if(!Number.isFinite(x.lat)||!Number.isFinite(x.lng)||x.lng<b.getWest()||x.lng>b.getEast()||x.lat<b.getSouth()||x.lat>b.getNorth()||x.departureMin<now)continue;const key=`${x.lat.toFixed(6)},${x.lng.toFixed(6)}|${x.place}`;if(!groups.has(key))groups.set(key,{place:x.place,lat:x.lat,lng:x.lng,times:[]});groups.get(key).times.push(x)}const arr=[...groups.values()];for(const g of arr){g.times.sort((a,b)=>a.arrivalMin-b.arrivalMin);g.active=g.times.find(t=>t.arrivalMin<=now&&t.departureMin>=now)||null;g.next=g.active||g.times.find(t=>t.arrivalMin>now)||g.times[0];g.distance=userPos?distM(userPos.lat,userPos.lng,g.lat,g.lng):null}arr.sort((a,b)=>userPos?a.distance-b.distance:a.next.arrivalMin-b.next.arrivalMin);return arr}function renderViewport(){if(!map.loaded()||!DATA.length)return;clearMarkers();const groups=visibleGroups(),now=nowMin(),tr=T[lang];for(const g of groups){const el=document.createElement('div');el.className='time-marker';el.textContent=g.active?`${tr.now}→${g.active.departure}`:g.next.arrival;const chips=g.times.map(t=>`<span class="popup-chip">${esc(t.arrival)}–${esc(t.departure)}</span>`).join('');const dist=g.distance==null?'':`<br><small>${Math.round(g.distance)} ${tr.fromYou}</small>`;const popup=new maplibregl.Popup({offset:18}).setHTML(`<b>${esc(g.place)}</b>${dist}<div class="popup-times">${chips}</div><a href="${gmaps(g)}" target="_blank" rel="noopener">${tr.openMaps}</a>`);markers.push(new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([g.lng,g.lat]).setPopup(popup).addTo(map))}listEl.innerHTML=groups.map((g,i)=>{const chips=g.times.map(t=>{const cls=(t.arrivalMin<=now&&t.departureMin>=now)?'now':(t===g.next?'next':'');return`<span class="chip ${cls}">${esc(t.arrival)}–${esc(t.departure)}</span>`}).join('');const d=g.distance==null?'':`${Math.round(g.distance)} ${tr.fromYou} · `;const rem=g.times.length===1?tr.remaining:tr.remainingPlural;return`<div class="place-card" data-i="${i}"><div class="addr">${esc(g.place)}</div><div class="meta">${d}${g.times.length} ${rem}</div><div class="times">${chips}</div><a class="glink" href="${gmaps(g)}" target="_blank" rel="noopener">${tr.openMaps}</a></div>`}).join('')||tr.noStops;[...listEl.querySelectorAll('.place-card')].forEach((el,i)=>el.addEventListener('click',e=>{if(e.target.closest('a'))return;const g=groups[i];map.flyTo({center:[g.lng,g.lat],zoom:17});markers[i].togglePopup()}));statusEl.textContent=`${groups.length} ${tr.visible} · ${tr.expired}${userPos?' · '+tr.sorted:''}`}function applyLang(){const tr=T[lang];document.documentElement.lang=lang;document.getElementById('locate').textContent=tr.locate;document.getElementById('panelTitle').textContent=tr.panel;document.getElementById('hint').textContent=tr.hint;renderViewport()}async function loadData(){try{const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw new Error(String(r.status));const j=await r.json();const rows=j.result?.results||j.result?.results?.results||j.results||[];DATA=rows.map(normalize).filter(x=>x.place&&Number.isFinite(x.lat)&&Number.isFinite(x.lng));if(!DATA.length)throw new Error('empty');statusEl.textContent=T[lang].intro;listEl.textContent=T[lang].browse;renderViewport()}catch(e){statusEl.textContent=T[lang].loadError;listEl.textContent=T[lang].loadError;console.error(e)}}map.on('load',loadData);map.on('moveend',renderViewport);map.on('zoomend',renderViewport);document.getElementById('lang').addEventListener('change',e=>{lang=e.target.value;applyLang()});document.getElementById('locate').addEventListener('click',()=>{const tr=T[lang];if(!navigator.geolocation){statusEl.textContent=tr.unsupported;return}statusEl.textContent=tr.getting;navigator.geolocation.getCurrentPosition(pos=>{userPos={lat:pos.coords.latitude,lng:pos.coords.longitude};if(userMarker)userMarker.remove();const el=document.createElement('div');el.className='user-dot';userMarker=new maplibregl.Marker({element:el}).setLngLat([userPos.lng,userPos.lat]).addTo(map);map.flyTo({center:[userPos.lng,userPos.lat],zoom:16});renderViewport()},()=>{statusEl.textContent=tr.blocked},{enableHighAccuracy:true,timeout:10000,maximumAge:0})});</script></body></html>
