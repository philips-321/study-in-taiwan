async function load(t){if(cache.has(t.key))return;if(flight.has(t.key))return flight.get(t.key);const p=fetch(t.url,{cache:"force-cache"}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(x=>cache.set(t.key,x)).finally(()=>flight.delete(t.key));flight.set(t.key,p);return p}
async function ensure(){if(map.getZoom()<MIN_TRUCK_ZOOM){render();return}let miss=needed().filter(t=>!cache.has(t.key));if(miss.length)statusEl.textContent=T[lang].loading;try{await Promise.all(miss.map(load));render()}catch(e){console.error(e);statusEl.textContent=T[lang].error}}
function overrideFor(city){return operations[city]?.dates?.[dateKey()]||null}function operates(x,city){const o=overrideFor(city);if(o?.general_garbage==="suspended"||o?.general_garbage==="special")return false;if(o?.general_garbage==="active")return true;const d=day();if(city==="taipei")return d!==0&&d!==3;return ((x.g||0)&(1<<d))!==0}function state(x,city,now){if(!operates(x,city))return"offday";if(city==="taipei"){if(x.dm<now)return"past";if(x.am<=now&&x.dm>=now)return"now";return"upcoming"}return x.am<now?"past":"upcoming"}
function serviceNote(g){const tr=T[lang],o=overrideFor(g.city);if(o){if(lang==="id"&&o.note_id)return o.note_id;if(lang==="en"&&o.note_en)return o.note_en;if(o.general_garbage==="suspended")return tr.suspended;if(o.general_garbage==="special")return tr.special}return g.city==="taipei"?tr.taipeiOff:tr.ntpcOff}
function groups(){if(map.getZoom()<MIN_TRUCK_ZOOM)return[];const b=map.getBounds(),now=nowMin(),m=new Map();for(const t of needed())for(const x of cache.get(t.key)||[]){if(x.x<b.getWest()||x.x>b.getEast()||x.y<b.getSouth()||x.y>b.getNorth())continue;if(t.city==="new-taipei"&&!x.g)continue;const k=`${t.city}|${x.y.toFixed(6)},${x.x.toFixed(6)}|${x.p}`;if(!m.has(k))m.set(k,{city:t.city,place:x.p,lat:x.y,lng:x.x,times:[],district:x.c||"",route:x.l||""});m.get(k).times.push(x)}const a=[...m.values()];for(const g of a){g.times.sort((x,y)=>x.am-y.am);g.active=g.times.find(x=>state(x,g.city,now)==="now")||null;g.next=g.times.find(x=>state(x,g.city,now)==="upcoming")||null;g.mark=g.active||g.next||g.times[g.times.length-1];g.st=state(g.mark,g.city,now);g.distance=userPos?dist(userPos.lat,userPos.lng,g.lat,g.lng):null}a.sort((x,y)=>userPos?x.distance-y.distance:(x.mark.am-y.mark.am));return a}
function acceptanceLabel(f){const tr=T[lang];if(f.accept.general&&f.accept.recycling&&f.accept.food)return tr.allThree;if(f.accept.general&&f.accept.recycling)return tr.generalRecycle;if(f.accept.general)return tr.generalOnly;return tr.recycling}
function renderFacilityMarkers(){clearFacilities();const b=map.getBounds();for(const f of facilities){if(f.lng<b.getWest()||f.lng>b.getEast()||f.lat<b.getSouth()||f.lat>b.getNorth())continue;const el=document.createElement("div");el.className="facility-marker";el.textContent="♻";const popup=new maplibregl.Popup({offset:18}).setHTML(`<b>${esc(f.name)}</b><br><small>${esc(f.district)} · ${esc(T[lang].facilityTitle)}</small><br>${esc(f.address)}<br><b>${esc(T[lang].hours)}:</b> ${esc(f.hours)}<br><b>${esc(T[lang].accepts)}:</b> ${esc(acceptanceLabel(f))}${f.note?`<br><small>${esc(f.note)}</small>`:""}<br><small>${esc(T[lang].bag)}</small><br><a href="${gmaps(f.lat,f.lng)}" target="_blank" rel="noopener">${T[lang].maps}</a>`);facilityMarkers.push(new maplibregl.Marker({element:el,anchor:"bottom"}).setLngLat([f.lng,f.lat]).setPopup(popup).addTo(map))}}
function todayGuide(){const tr=T[lang],d=day();if(d===0||d===3)return`<b>${tr.today}</b><br>${tr.noRegular}<br><span class="meta">${tr.bag}</span>`;const category=(d===1||d===5)?tr.flat:tr.threeD;return`<b>${tr.today}</b><br>• ${tr.general}<br>• ${tr.food}<br>• ${category}<br>• ${tr.other}<br><span class="meta">${tr.bag}</span>`}
function render(){if(!map.loaded()||!sources.length)return;clearTrucks();renderFacilityMarkers();document.getElementById("todayGuide").innerHTML=todayGuide();const tr=T[lang];if(map.getZoom()<MIN_TRUCK_ZOOM){listEl.innerHTML=`<div class="zoom-note">${tr.zoomIn}</div>`;statusEl.textContent=`${cache.size} ${tr.cached}`;return}const a=groups(),now=nowMin();for(const g of a){const el=document.createElement("div");el.className=`time-marker ${g.st}`;el.textContent=g.active?`${tr.nowShort}→${g.active.d}`:g.mark.a;const chips=g.times.map(x=>`<span class="popup-chip ${state(x,g.city,now)}">${esc(x.a)}${x.d?"–"+esc(x.d):""}</span>`).join("");const note=g.st==="offday"?`<br><small>${esc(serviceNote(g))}</small>`:"";const ds=g.distance==null?"":`<br><small>${Math.round(g.distance)} ${tr.from}</small>`;const route=g.route?`<br><small>${esc(g.route)}</small>`:"";const popup=new maplibregl.Popup({offset:18}).setHTML(`<b>${esc(g.place)}</b><br><small>${g.city==="taipei"?"Taipei":"New Taipei"}${g.district?" · "+esc(g.district):""}</small>${route}${ds}${note}<div class="popup-times">${chips}</div><a href="${gmaps(g.lat,g.lng)}" target="_blank" rel="noopener">${tr.maps}</a>`);truckMarkers.push(new maplibregl.Marker({element:el,anchor:"bottom"}).setLngLat([g.lng,g.lat]).setPopup(popup).addTo(map))}listEl.innerHTML=a.map((g,i)=>{const chips=g.times.map(x=>`<span class="chip ${state(x,g.city,now)}">${esc(x.a)}${x.d?"–"+esc(x.d):""}</span>`).join("");const ds=g.distance==null?"":`${Math.round(g.distance)} ${tr.from} · `;const note=g.st==="offday"?`<div class="meta">${esc(serviceNote(g))}</div>`:"";const route=g.route?`<div class="meta">${esc(g.route)}</div>`:"";return`<div class="place-card ${g.st}" data-i="${i}"><div class="addr">${esc(g.place)}</div><div class="meta">${ds}${g.city==="taipei"?"Taipei":"New Taipei"}${g.district?" · "+esc(g.district):""}</div>${route}${note}<div class="times">${chips}</div><a class="glink" href="${gmaps(g.lat,g.lng)}" target="_blank" rel="noopener">${tr.maps}</a></div>`}).join("")||tr.none;[...listEl.querySelectorAll(".place-card")].forEach((el,i)=>el.onclick=e=>{if(e.target.closest("a"))return;let g=a[i];map.flyTo({center:[g.lng,g.lat],zoom:17});truckMarkers[i].togglePopup()});statusEl.textContent=`${a.length} ${tr.visible}${userPos?" · "+tr.nearest:""} · ${cache.size} ${tr.cached}`}
function applyLang(){const tr=T[lang];document.documentElement.lang=lang;document.getElementById("brand").textContent=tr.brand;document.getElementById("locate").textContent=tr.locate;document.getElementById("share").textContent=tr.share;document.querySelector('[data-share="copy"]').textContent=tr.copy;document.getElementById("shareNote").textContent=tr.shareNote;document.getElementById("panelTitle").textContent=tr.panel;document.getElementById("hint").textContent=tr.hint;document.getElementById("lp").textContent=tr.past;document.getElementById("ln").textContent=tr.now;document.getElementById("lu").textContent=tr.up;document.getElementById("lo").textContent=tr.off;document.getElementById("lf").textContent=tr.facility;render()}
async function readJson(url,fallback=null){try{const r=await fetch(url,{cache:"force-cache"});if(!r.ok)throw Error(r.status);return await r.json()}catch(e){console.warn(url,e);return fallback}}
async function init(){try{const defs=[{city:"taipei",url:"data/manifest.json",base:"data/"},{city:"new-taipei",url:"data/new-taipei/manifest.json",base:"data/new-taipei/"}];sources=await Promise.all(defs.map(async d=>({...d,manifest:await readJson(d.url,null)})));if(sources.some(s=>!s.manifest))throw Error("manifest");const [to,no,ff]=await Promise.all([readJson("data/operations/taipei.json",{dates:{}}),readJson("data/operations/new-taipei.json",{dates:{}}),readJson("data/facilities/taipei.json",{facilities:[]})]);operations={taipei:to||{dates:{}},"new-taipei":no||{dates:{}}};facilities=ff?.facilities||[];await ensure()}catch(e){console.error(e);statusEl.textContent=T[lang].error;listEl.textContent=T[lang].error}}
map.on("load",init);map.on("moveend",ensure);map.on("zoomend",ensure);document.getElementById("lang").onchange=e=>{lang=e.target.value;applyLang()};document.getElementById("locate").onclick=()=>{const tr=T[lang];if(!navigator.geolocation){statusEl.textContent=tr.blocked;return}statusEl.textContent=tr.getting;navigator.geolocation.getCurrentPosition(p=>{userPos={lat:p.coords.latitude,lng:p.coords.longitude};if(userMarker)userMarker.remove();const el=document.createElement("div");el.className="user-dot";userMarker=new maplibregl.Marker({element:el}).setLngLat([userPos.lng,userPos.lat]).addTo(map);map.flyTo({center:[userPos.lng,userPos.lat],zoom:16})},()=>statusEl.textContent=tr.blocked,{enableHighAccuracy:true,timeout:10000,maximumAge:0})};
</script>
<script>
(function(){const r=document.documentElement,tb=document.getElementById("theme"),sb=document.getElementById("sheetToggle"),pn=document.getElementById("panel"),lg=document.getElementById("lang"),sw=document.getElementById("shareWrap"),share=document.getElementById("share"),K="siteTheme";const L={en:{dark:"Switch to dark mode",light:"Switch to light mode",hide:"Hide list",show:"Show list"},id:{dark:"Ganti ke mode gelap",light:"Ganti ke mode terang",hide:"Sembunyikan daftar",show:"Tampilkan daftar"}};function cur(){return r.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}function lab(){const t=L[lg.value]||L.en,d=cur()==="dark",c=pn.classList.contains("collapsed");tb.textContent=d?"☀":"☾";tb.title=tb.ariaLabel=d?t.light:t.dark;sb.ariaLabel=c?t.show:t.hide;sb.setAttribute("aria-expanded",String(!c))}try{const v=localStorage.getItem(K);if(v==="dark"||v==="light")r.dataset.theme=v}catch(e){}tb.onclick=()=>{const n=cur()==="dark"?"light":"dark";r.dataset.theme=n;try{localStorage.setItem(K,n)}catch(e){}lab()};function fit(){requestAnimationFrame(()=>{try{map.resize()}catch(e){}})}function flip(){pn.classList.toggle("collapsed");lab();fit()}sb.onclick=flip;pn.addEventListener("click",e=>{if(pn.classList.contains("collapsed")&&e.target!==sb)flip()});lg.addEventListener("change",lab);matchMedia("(prefers-color-scheme:dark)").addEventListener("change",lab);lab();
share.onclick=e=>{e.stopPropagation();const open=sw.classList.toggle("open");share.setAttribute("aria-expanded",String(open))};document.addEventListener("click",e=>{if(!sw.contains(e.target)){sw.classList.remove("open");share.setAttribute("aria-expanded","false")}});async function copyLink(){try{await navigator.clipboard.writeText(location.href);statusEl.textContent=T[lang].copied}catch(e){prompt(T[lang].copy,location.href)}}async function nativeShare(){if(navigator.share){try{await navigator.share({title:T[lang].brand,text:T[lang].brand,url:location.href});return}catch(e){if(e?.name==="AbortError")return}}await copyLink()}
document.getElementById("shareMenu").addEventListener("click",async e=>{const b=e.target.closest("button[data-share]");if(!b)return;const u=encodeURIComponent(location.href),txt=encodeURIComponent(T[lang].brand+" "+location.href);if(b.dataset.share==="whatsapp")window.open(`https://wa.me/?text=${txt}`,"_blank","noopener");else if(b.dataset.share==="facebook")window.open(`https://www.facebook.com/sharer/sharer.php?u=${u}`,"_blank","noopener");else if(b.dataset.share==="threads")window.open(`https://www.threads.net/intent/post?text=${txt}`,"_blank","noopener");else if(b.dataset.share==="instagram")await nativeShare();else if(b.dataset.share==="copy")await copyLink();sw.classList.remove("open");share.setAttribute("aria-expanded","false")});
})();
</script></body></html>
