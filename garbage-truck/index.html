<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taiwan Garbage Truck Map | Study in Taiwan</title>
<meta name="description" content="Find Taipei and New Taipei garbage truck pickup times and Taipei fixed garbage/recycling drop-off facilities.">
<link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#fff}#app{height:100%;display:grid;grid-template-rows:auto 1fr}header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid #ddd;background:#fff;z-index:3}.brand{font-weight:700;margin-right:auto}.controls{display:flex;gap:8px;align-items:center}button,select{font:inherit;padding:9px 11px;border:1px solid #bbb;border-radius:9px;background:#fff}button{cursor:pointer}#status{font-size:13px;color:#555;flex-basis:100%}#content{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px}#map{min-height:520px}#panel{overflow:auto;border-left:1px solid #ddd;background:#fff;padding:12px}#panel h2{font-size:17px;margin:0 0 4px}.hint{font-size:12px;color:#666}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin:8px 0 10px}.legend span{display:flex;align-items:center;gap:5px}.dot{width:9px;height:9px;border-radius:50%}.dot.past{background:#8b8b8b}.dot.now{background:#18864b}.dot.upcoming{background:#2463eb}.dot.offday{background:#8b5cf6}.dot.facility{background:#087f5b;border-radius:2px}.place-card{border-top:1px solid #eee;padding:10px 0}.addr{font-size:13px;font-weight:700;line-height:1.35}.meta{font-size:12px;color:#666;margin-top:3px}.times,.accepts{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.chip,.popup-chip,.accept-chip{font-size:12px;border:1px solid #ccc;border-radius:999px;padding:3px 7px;background:#f7f7f7}.chip.past,.popup-chip.past{color:#777;background:#f1f1f1}.chip.now,.popup-chip.now{background:#18864b;color:#fff;border-color:#18864b}.chip.upcoming,.popup-chip.upcoming{background:#eaf0ff;color:#174bb8;border-color:#9db7ff}.chip.offday,.popup-chip.offday{background:#f1eafe;color:#6d28d9;border-color:#c4b5fd}.time-marker{padding:3px 6px;border-radius:6px;font:bold 12px/1.1 sans-serif;white-space:nowrap;border:1px solid #fff;box-shadow:0 1px 4px #0004;color:#fff}.time-marker.past{background:#8b8b8b}.time-marker.now{background:#18864b}.time-marker.upcoming{background:#2463eb}.time-marker.offday{background:#8b5cf6}.facility-marker{width:28px;height:28px;border-radius:7px;background:#087f5b;color:#fff;border:2px solid #fff;box-shadow:0 1px 5px #0005;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}.user-dot{width:18px;height:18px;border-radius:50%;background:#1677ff;border:3px solid #fff;box-shadow:0 0 0 2px #1677ff}.popup-times{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.glink{display:inline-block;margin-top:6px;font-size:12px;text-decoration:none}.section-title{font-size:13px;font-weight:700;margin:12px 0 4px}.guide{padding:9px 10px;border:1px solid #e3e3e3;border-radius:10px;background:#fafafa;margin:8px 0 10px;font-size:12px;line-height:1.45}.zoom-note{padding:12px;border-radius:10px;background:#f5f7fb;color:#555;font-size:13px}@media(max-width:800px){#content{grid-template-columns:1fr;grid-template-rows:minmax(430px,62vh) auto}#panel{border-left:0;border-top:1px solid #ddd}}
</style></head>
<body><div id="app"><header><div class="brand" id="brand">Garbage Truck Map</div><div class="controls"><button id="locate">Use my location</button><select id="lang"><option value="en">English</option><option value="id">Indonesia</option></select></div><div id="status">Loading nearby area…</div></header><div id="content"><div id="map"></div><aside id="panel"><h2 id="panelTitle">Visible pickup locations</h2><div class="hint" id="hint">Truck times and fixed drop-off facilities near the current map area.</div><div class="legend"><span><i class="dot past"></i><b id="lp">Past today</b></span><span><i class="dot now"></i><b id="ln">Active now</b></span><span><i class="dot upcoming"></i><b id="lu">Upcoming</b></span><span><i class="dot offday"></i><b id="lo">Planning only</b></span><span><i class="dot facility"></i><b id="lf">Fixed drop-off</b></span></div><div id="todayGuide" class="guide"></div><div id="list">Loading…</div></aside></div></div>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script>
const MIN_TRUCK_ZOOM=14;
const SHIDA=[121.5297,25.0268];
const T={
 en:{brand:"Garbage Truck Map",locate:"Use my location",panel:"Visible pickup locations",hint:"Truck times and fixed drop-off facilities near the current map area.",none:"No scheduled pickup locations in this viewport.",maps:"Google Maps ↗",from:"m from you",visible:"visible truck locations",nearest:"nearest first",loading:"Loading nearby area…",error:"Could not load map data.",getting:"Getting your location…",blocked:"Location blocked; you can still browse manually.",past:"Past today",now:"Active now",up:"Upcoming",off:"Planning only",facility:"Fixed drop-off",cached:"grids cached",taipeiOff:"Taipei: no regular collection Wednesday/Sunday",ntpcOff:"No general-garbage service at this stop today",suspended:"Collection suspended today",special:"Special collection schedule today; baseline times are shown for planning only",nowShort:"NOW",zoomIn:"Zoom in to see individual truck stops. Fixed drop-off facilities remain visible.",today:"What can I put out today?",general:"General trash",recycling:"Recycling",food:"Food waste",bag:"Taipei general trash requires an official Taipei designated garbage bag (專用垃圾袋; approved anti-counterfeit-labelled bags are also accepted where applicable).",flat:"Mon/Fri: paper, books, clean clothing, clean plastic bags",threeD:"Tue/Thu/Sat: PET/plastic bottles, cans, glass bottles, paper containers, styrofoam, small electronics/3C",other:"Other accepted recyclables such as batteries, fluorescent lamps and CDs are handled on regular collection days.",noRegular:"No regular Taipei collection today.",hours:"Hours",accepts:"Accepts",phone:"Phone",facilityTitle:"Fixed drop-off facility",generalOnly:"General trash only",generalRecycle:"General trash + recycling",allThree:"General trash + recycling + food waste"},
 id:{brand:"Peta Truk Sampah",locate:"Gunakan lokasi saya",panel:"Lokasi pengambilan yang terlihat",hint:"Jadwal truk dan tempat drop-off tetap di area peta saat ini.",none:"Tidak ada titik terjadwal di area peta ini.",maps:"Google Maps ↗",from:"m dari Anda",visible:"lokasi truk terlihat",nearest:"terdekat di atas",loading:"Memuat area sekitar…",error:"Data peta tidak bisa dimuat.",getting:"Mengambil lokasi Anda…",blocked:"Akses lokasi diblokir; peta tetap bisa digunakan manual.",past:"Sudah lewat",now:"Sedang aktif",up:"Akan datang",off:"Untuk perencanaan",facility:"Drop-off tetap",cached:"grid tersimpan",taipeiOff:"Taipei: Rabu/Minggu tidak ada pengangkutan reguler",ntpcOff:"Titik ini tidak melayani sampah umum hari ini",suspended:"Pengangkutan dihentikan hari ini",special:"Hari ini memakai jadwal khusus; jam reguler hanya untuk perencanaan",nowShort:"SEKARANG",zoomIn:"Zoom lebih dekat untuk melihat titik truk satu per satu. Tempat drop-off tetap masih ditampilkan.",today:"Hari ini bisa buang apa?",general:"Sampah umum",recycling:"Daur ulang",food:"Sampah makanan",bag:"Sampah umum di Taipei wajib memakai kantong sampah resmi Taipei (專用垃圾袋; kantong berlabel anti-pemalsuan yang disetujui juga berlaku jika sesuai).",flat:"Senin/Jumat: kertas, buku, pakaian bersih, kantong plastik bersih",threeD:"Selasa/Kamis/Sabtu: botol PET/plastik, kaleng, botol kaca, wadah kertas, styrofoam, elektronik kecil/3C",other:"Kategori lain seperti baterai, lampu fluorescent, dan CD ditangani pada hari pengangkutan reguler.",noRegular:"Hari ini tidak ada pengangkutan reguler Taipei.",hours:"Jam buka",accepts:"Menerima",phone:"Telepon",facilityTitle:"Tempat drop-off tetap",generalOnly:"Hanya sampah umum",generalRecycle:"Sampah umum + daur ulang",allThree:"Sampah umum + daur ulang + sampah makanan"}
};
let lang="en",sources=[],operations={},facilities=[],userPos=null,userMarker=null,truckMarkers=[],facilityMarkers=[];const cache=new Map(),flight=new Map();const statusEl=document.getElementById("status"),listEl=document.getElementById("list");
const map=new maplibregl.Map({container:"map",style:"https://tiles.openfreemap.org/styles/liberty",center:SHIDA,zoom:15.6});map.addControl(new maplibregl.NavigationControl(),"top-left");
function nowMin(){let d=new Date();return d.getHours()*60+d.getMinutes()}function day(){return new Date().getDay()}function dateKey(){const d=new Date(),p=n=>String(n).padStart(2,"0");return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}function dist(a,b,c,d){const R=6371000,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p,q=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}function gmaps(lat,lng){return`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`}function overlap(b,t){let[w,s,e,n]=t.bounds;return!(e<b.getWest()||w>b.getEast()||n<b.getSouth()||s>b.getNorth())}
function clearTrucks(){truckMarkers.forEach(m=>m.remove());truckMarkers=[]}function clearFacilities(){facilityMarkers.forEach(m=>m.remove());facilityMarkers=[]}
function needed(){if(map.getZoom()<MIN_TRUCK_ZOOM)return[];const b=map.getBounds(),out=[];for(const s of sources)for(const t of s.manifest.tiles)if(overlap(b,t))out.push({city:s.city,key:`${s.city}:${t.id}`,url:s.base+t.file,bounds:t.bounds});return out}
async function load(t){if(cache.has(t.key))return;if(flight.has(t.key))return flight.get(t.key);const p=fetch(t.url,{cache:"force-cache"}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(x=>cache.set(t.key,x)).finally(()=>flight.delete(t.key));flight.set(t.key,p);return p}
async function ensure(){if(map.getZoom()<MIN_TRUCK_ZOOM){render();return}let miss=needed().filter(t=>!cache.has(t.key));if(miss.length)statusEl.textContent=T[lang].loading;try{await Promise.all(miss.map(load));render()}catch(e){console.error(e);statusEl.textContent=T[lang].error}}
function overrideFor(city){return operations[city]?.dates?.[dateKey()]||null}
function operates(x,city){const o=overrideFor(city);if(o?.general_garbage==="suspended"||o?.general_garbage==="special")return false;if(o?.general_garbage==="active")return true;const d=day();if(city==="taipei")return d!==0&&d!==3;return ((x.g||0)&(1<<d))!==0}
function state(x,city,now){if(!operates(x,city))return"offday";if(city==="taipei"){if(x.dm<now)return"past";if(x.am<=now&&x.dm>=now)return"now";return"upcoming"}return x.am<now?"past":"upcoming"}
function serviceNote(g){const tr=T[lang],o=overrideFor(g.city);if(o){if(lang==="id"&&o.note_id)return o.note_id;if(lang==="en"&&o.note_en)return o.note_en;if(o.general_garbage==="suspended")return tr.suspended;if(o.general_garbage==="special")return tr.special}return g.city==="taipei"?tr.taipeiOff:tr.ntpcOff}
function groups(){if(map.getZoom()<MIN_TRUCK_ZOOM)return[];const b=map.getBounds(),now=nowMin(),m=new Map();for(const t of needed())for(const x of cache.get(t.key)||[]){if(x.x<b.getWest()||x.x>b.getEast()||x.y<b.getSouth()||x.y>b.getNorth())continue;if(t.city==="new-taipei"&&!x.g)continue;const k=`${t.city}|${x.y.toFixed(6)},${x.x.toFixed(6)}|${x.p}`;if(!m.has(k))m.set(k,{city:t.city,place:x.p,lat:x.y,lng:x.x,times:[],district:x.c||"",route:x.l||""});m.get(k).times.push(x)}const a=[...m.values()];for(const g of a){g.times.sort((x,y)=>x.am-y.am);g.active=g.times.find(x=>state(x,g.city,now)==="now")||null;g.next=g.times.find(x=>state(x,g.city,now)==="upcoming")||null;g.mark=g.active||g.next||g.times[g.times.length-1];g.st=state(g.mark,g.city,now);g.distance=userPos?dist(userPos.lat,userPos.lng,g.lat,g.lng):null}a.sort((x,y)=>userPos?x.distance-y.distance:(x.mark.am-y.mark.am));return a}
function acceptanceLabel(f){const tr=T[lang];if(f.accept.general&&f.accept.recycling&&f.accept.food)return tr.allThree;if(f.accept.general&&f.accept.recycling)return tr.generalRecycle;if(f.accept.general)return tr.generalOnly;return tr.recycling}
function renderFacilityMarkers(){clearFacilities();const b=map.getBounds();for(const f of facilities){if(f.lng<b.getWest()||f.lng>b.getEast()||f.lat<b.getSouth()||f.lat>b.getNorth())continue;const el=document.createElement("div");el.className="facility-marker";el.textContent="♻";const popup=new maplibregl.Popup({offset:18}).setHTML(`<b>${esc(f.name)}</b><br><small>${esc(f.district)} · ${esc(T[lang].facilityTitle)}</small><br>${esc(f.address)}<br><b>${esc(T[lang].hours)}:</b> ${esc(f.hours)}<br><b>${esc(T[lang].accepts)}:</b> ${esc(acceptanceLabel(f))}${f.note?`<br><small>${esc(f.note)}</small>`:""}<br><small>${esc(T[lang].bag)}</small><br><a href="${gmaps(f.lat,f.lng)}" target="_blank" rel="noopener">${T[lang].maps}</a>`);facilityMarkers.push(new maplibregl.Marker({element:el,anchor:"bottom"}).setLngLat([f.lng,f.lat]).setPopup(popup).addTo(map))}}
function todayGuide(){const tr=T[lang],d=day();if(d===0||d===3)return`<b>${tr.today}</b><br>${tr.noRegular}<br><span class="meta">${tr.bag}</span>`;const category=(d===1||d===5)?tr.flat:tr.threeD;return`<b>${tr.today}</b><br>• ${tr.general}<br>• ${tr.food}<br>• ${category}<br>• ${tr.other}<br><span class="meta">${tr.bag}</span>`}
function render(){if(!map.loaded()||!sources.length)return;clearTrucks();renderFacilityMarkers();document.getElementById("todayGuide").innerHTML=todayGuide();const tr=T[lang];if(map.getZoom()<MIN_TRUCK_ZOOM){listEl.innerHTML=`<div class="zoom-note">${tr.zoomIn}</div>`;statusEl.textContent=`${cache.size} ${tr.cached}`;return}const a=groups(),now=nowMin();for(const g of a){const el=document.createElement("div");el.className=`time-marker ${g.st}`;el.textContent=g.active?`${tr.nowShort}→${g.active.d}`:g.mark.a;const chips=g.times.map(x=>`<span class="popup-chip ${state(x,g.city,now)}">${esc(x.a)}${x.d?"–"+esc(x.d):""}</span>`).join("");const note=g.st==="offday"?`<br><small>${esc(serviceNote(g))}</small>`:"";const ds=g.distance==null?"":`<br><small>${Math.round(g.distance)} ${tr.from}</small>`;const route=g.route?`<br><small>${esc(g.route)}</small>`:"";const popup=new maplibregl.Popup({offset:18}).setHTML(`<b>${esc(g.place)}</b><br><small>${g.city==="taipei"?"Taipei":"New Taipei"}${g.district?" · "+esc(g.district):""}</small>${route}${ds}${note}<div class="popup-times">${chips}</div><a href="${gmaps(g.lat,g.lng)}" target="_blank" rel="noopener">${tr.maps}</a>`);truckMarkers.push(new maplibregl.Marker({element:el,anchor:"bottom"}).setLngLat([g.lng,g.lat]).setPopup(popup).addTo(map))}
listEl.innerHTML=a.map((g,i)=>{const chips=g.times.map(x=>`<span class="chip ${state(x,g.city,now)}">${esc(x.a)}${x.d?"–"+esc(x.d):""}</span>`).join("");const ds=g.distance==null?"":`${Math.round(g.distance)} ${tr.from} · `;const note=g.st==="offday"?`<div class="meta">${esc(serviceNote(g))}</div>`:"";const route=g.route?`<div class="meta">${esc(g.route)}</div>`:"";return`<div class="place-card" data-i="${i}"><div class="addr">${esc(g.place)}</div><div class="meta">${ds}${g.city==="taipei"?"Taipei":"New Taipei"}${g.district?" · "+esc(g.district):""}</div>${route}${note}<div class="times">${chips}</div><a class="glink" href="${gmaps(g.lat,g.lng)}" target="_blank" rel="noopener">${tr.maps}</a></div>`}).join("")||tr.none;[...listEl.querySelectorAll(".place-card")].forEach((el,i)=>el.onclick=e=>{if(e.target.closest("a"))return;let g=a[i];map.flyTo({center:[g.lng,g.lat],zoom:17});truckMarkers[i].togglePopup()});statusEl.textContent=`${a.length} ${tr.visible}${userPos?" · "+tr.nearest:""} · ${cache.size} ${tr.cached}`}
function applyLang(){const tr=T[lang];document.documentElement.lang=lang;document.getElementById("brand").textContent=tr.brand;document.getElementById("locate").textContent=tr.locate;document.getElementById("panelTitle").textContent=tr.panel;document.getElementById("hint").textContent=tr.hint;document.getElementById("lp").textContent=tr.past;document.getElementById("ln").textContent=tr.now;document.getElementById("lu").textContent=tr.up;document.getElementById("lo").textContent=tr.off;document.getElementById("lf").textContent=tr.facility;render()}
async function readJson(url,fallback=null){try{const r=await fetch(url,{cache:"force-cache"});if(!r.ok)throw Error(r.status);return await r.json()}catch(e){console.warn(url,e);return fallback}}
async function init(){try{const defs=[{city:"taipei",url:"data/manifest.json",base:"data/"},{city:"new-taipei",url:"data/new-taipei/manifest.json",base:"data/new-taipei/"}];sources=await Promise.all(defs.map(async d=>({...d,manifest:await readJson(d.url,null)})));if(sources.some(s=>!s.manifest))throw Error("manifest");const [to,no,ff]=await Promise.all([readJson("data/operations/taipei.json",{dates:{}}),readJson("data/operations/new-taipei.json",{dates:{}}),readJson("data/facilities/taipei.json",{facilities:[]})]);operations={taipei:to||{dates:{}},"new-taipei":no||{dates:{}}};facilities=ff?.facilities||[];await ensure()}catch(e){console.error(e);statusEl.textContent=T[lang].error;listEl.textContent=T[lang].error}}
map.on("load",init);map.on("moveend",ensure);map.on("zoomend",ensure);document.getElementById("lang").onchange=e=>{lang=e.target.value;applyLang()};document.getElementById("locate").onclick=()=>{const tr=T[lang];if(!navigator.geolocation){statusEl.textContent=tr.blocked;return}statusEl.textContent=tr.getting;navigator.geolocation.getCurrentPosition(p=>{userPos={lat:p.coords.latitude,lng:p.coords.longitude};if(userMarker)userMarker.remove();const el=document.createElement("div");el.className="user-dot";userMarker=new maplibregl.Marker({element:el}).setLngLat([userPos.lng,userPos.lat]).addTo(map);map.flyTo({center:[userPos.lng,userPos.lat],zoom:16})},()=>statusEl.textContent=tr.blocked,{enableHighAccuracy:true,timeout:10000,maximumAge:0})};
</script></body></html>
