<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taiwan Garbage Truck Map | Study in Taiwan</title>
<meta name="description" content="Find Taipei and New Taipei garbage truck pickup times on a map, with optional GPS for nearby stops.">
<link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#fff}#app{height:100%;display:grid;grid-template-rows:auto 1fr}header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid #ddd;background:#fff;z-index:3}.brand{font-weight:700;margin-right:auto}.controls{display:flex;gap:8px;align-items:center}button,select{font:inherit;padding:9px 11px;border:1px solid #bbb;border-radius:9px;background:#fff}button{cursor:pointer}#status{font-size:13px;color:#555;flex-basis:100%}#content{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px}#map{min-height:520px}#panel{overflow:auto;border-left:1px solid #ddd;background:#fff;padding:12px}#panel h2{font-size:17px;margin:0 0 4px}.hint{font-size:12px;color:#666}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin:8px 0 10px}.legend span{display:flex;align-items:center;gap:5px}.dot{width:9px;height:9px;border-radius:50%}.past{--c:#8b8b8b}.now{--c:#18864b}.upcoming{--c:#2463eb}.offday{--c:#8b5cf6}.dot{background:var(--c)}.place-card{border-top:1px solid #eee;padding:10px 0}.addr{font-size:13px;font-weight:700;line-height:1.35}.meta{font-size:12px;color:#666;margin-top:3px}.times{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.chip,.popup-chip{font-size:12px;border:1px solid #ccc;border-radius:999px;padding:3px 7px;background:#f7f7f7}.chip.past,.popup-chip.past{color:#777;background:#f1f1f1}.chip.now,.popup-chip.now{background:#18864b;color:#fff;border-color:#18864b}.chip.upcoming,.popup-chip.upcoming{background:#eaf0ff;color:#174bb8;border-color:#9db7ff}.chip.offday,.popup-chip.offday{background:#f1eafe;color:#6d28d9;border-color:#c4b5fd}.time-marker{padding:3px 6px;border-radius:6px;font:bold 12px/1.1 sans-serif;white-space:nowrap;border:1px solid #fff;box-shadow:0 1px 4px #0004;color:#fff;background:var(--c)}.user-dot{width:18px;height:18px;border-radius:50%;background:#1677ff;border:3px solid #fff;box-shadow:0 0 0 2px #1677ff}.popup-times{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.glink{display:inline-block;margin-top:6px;font-size:12px;text-decoration:none}@media(max-width:800px){#content{grid-template-columns:1fr;grid-template-rows:minmax(430px,62vh) auto}#panel{border-left:0;border-top:1px solid #ddd}}
</style></head>
<body><div id="app"><header><div class="brand">Garbage Truck Map</div><div class="controls"><button id="locate">Use my location</button><select id="lang"><option value="en">English</option><option value="id">Indonesia</option></select></div><div id="status">Loading map data…</div></header><div id="content"><div id="map"></div><aside id="panel"><h2 id="panelTitle">Visible pickup locations</h2><div class="hint" id="hint">All scheduled times stay visible for planning. GPS is optional.</div><div class="legend"><span><i class="dot past"></i><b id="lp">Past today</b></span><span><i class="dot now"></i><b id="ln">Active now</b></span><span><i class="dot upcoming"></i><b id="lu">Upcoming</b></span><span><i class="dot offday"></i><b id="lo">Planning only</b></span></div><div id="list">Move the map to browse Taipei and New Taipei.</div></aside></div></div>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script>
const T={en:{locate:"Use my location",panel:"Visible pickup locations",hint:"All scheduled times stay visible for planning. GPS is optional.",browse:"Move the map to browse Taipei and New Taipei.",none:"No scheduled pickup locations in this viewport.",maps:"Google Maps ↗",from:"m from you",visible:"visible locations",nearest:"nearest first",loading:"Loading nearby area…",error:"Could not load map data.",getting:"Getting your location…",blocked:"Location blocked; you can still browse manually.",past:"Past today",now:"Active now",up:"Upcoming",off:"Planning only",cached:"grids cached",taipeiOff:"Taipei: no regular collection Wednesday/Sunday",ntpcOff:"No general-garbage service at this stop today"},id:{locate:"Gunakan lokasi saya",panel:"Titik pengambilan yang terlihat",hint:"Semua jam tetap ditampilkan untuk perencanaan. GPS tidak wajib.",browse:"Geser peta untuk melihat Taipei dan New Taipei.",none:"Tidak ada titik terjadwal di area peta ini.",maps:"Google Maps ↗",from:"m dari Anda",visible:"lokasi terlihat",nearest:"terdekat di atas",loading:"Memuat area sekitar…",error:"Data peta tidak bisa dimuat.",getting:"Mengambil lokasi Anda…",blocked:"Akses lokasi diblokir; peta tetap bisa digunakan manual.",past:"Sudah lewat",now:"Sedang aktif",up:"Akan datang",off:"Untuk perencanaan",cached:"grid tersimpan",taipeiOff:"Taipei: Rabu/Minggu tidak ada pengangkutan reguler",ntpcOff:"Titik ini tidak melayani sampah umum hari ini"}};
let lang="en",sources=[],userPos=null,userMarker=null,markers=[];const cache=new Map(),flight=new Map();const statusEl=document.getElementById("status"),listEl=document.getElementById("list");
const map=new maplibregl.Map({container:"map",style:"https://tiles.openfreemap.org/styles/liberty",center:[121.5319,25.0478],zoom:11.8});map.addControl(new maplibregl.NavigationControl(),"top-left");
function nowMin(){let d=new Date();return d.getHours()*60+d.getMinutes()}function day(){return new Date().getDay()}function dist(a,b,c,d){const R=6371000,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p,q=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}function gmaps(g){return`https://www.google.com/maps/search/?api=1&query=${g.lat},${g.lng}`}function overlap(b,t){let[w,s,e,n]=t.bounds;return!(e<b.getWest()||w>b.getEast()||n<b.getSouth()||s>b.getNorth())}function clear(){markers.forEach(m=>m.remove());markers=[]}
function needed(){const b=map.getBounds(),out=[];for(const s of sources)for(const t of s.manifest.tiles)if(overlap(b,t))out.push({city:s.city,key:`${s.city}:${t.id}`,url:s.base+t.file,bounds:t.bounds});return out}
async function load(t){if(cache.has(t.key))return; if(flight.has(t.key))return flight.get(t.key);const p=fetch(t.url,{cache:"force-cache"}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(x=>cache.set(t.key,x)).finally(()=>flight.delete(t.key));flight.set(t.key,p);return p}
async function ensure(){let miss=needed().filter(t=>!cache.has(t.key));if(miss.length)statusEl.textContent=T[lang].loading;try{await Promise.all(miss.map(load));render()}catch(e){console.error(e);statusEl.textContent=T[lang].error}}
function operates(x,city){const d=day();if(city==="taipei")return d!==0&&d!==3;return ((x.g||0)&(1<<d))!==0}
function state(x,city,now){if(!operates(x,city))return"offday";if(city==="taipei"){if(x.dm<now)return"past";if(x.am<=now&&x.dm>=now)return"now";return"upcoming"}return x.am<now?"past":"upcoming"}
function groups(){const b=map.getBounds(),now=nowMin(),m=new Map();for(const t of needed())for(const x of cache.get(t.key)||[]){if(x.x<b.getWest()||x.x>b.getEast()||x.y<b.getSouth()||x.y>b.getNorth())continue;const k=`${t.city}|${x.y.toFixed(6)},${x.x.toFixed(6)}|${x.p}`;if(!m.has(k))m.set(k,{city:t.city,place:x.p,lat:x.y,lng:x.x,times:[],district:x.c||"",route:x.l||""});m.get(k).times.push(x)}const a=[...m.values()];for(const g of a){g.times.sort((x,y)=>x.am-y.am);g.active=g.times.find(x=>state(x,g.city,now)==="now")||null;g.next=g.times.find(x=>state(x,g.city,now)==="upcoming")||null;g.mark=g.active||g.next||g.times[g.times.length-1];g.st=state(g.mark,g.city,now);g.distance=userPos?dist(userPos.lat,userPos.lng,g.lat,g.lng):null}a.sort((x,y)=>userPos?x.distance-y.distance:(x.mark.am-y.mark.am));return a}
function render(){if(!map.loaded()||!sources.length)return;clear();const a=groups(),now=nowMin(),tr=T[lang];for(const g of a){const el=document.createElement("div");el.className=`time-marker ${g.st}`;el.textContent=g.active?`NOW→${g.active.d}`:g.mark.a;const chips=g.times.map(x=>`<span class="popup-chip ${state(x,g.city,now)}">${esc(x.a)}${x.d?"–"+esc(x.d):""}</span>`).join("");const note=g.st==="offday"?`<br><small>${g.city==="taipei"?tr.taipeiOff:tr.ntpcOff}</small>`:"";const ds=g.distance==null?"":`<br><small>${Math.round(g.distance)} ${tr.from}</small>`;const popup=new maplibregl.Popup({offset:18}).setHTML(`<b>${esc(g.place)}</b><br><small>${g.city==="taipei"?"Taipei":"New Taipei"}${g.district?" · "+esc(g.district):""}</small>${ds}${note}<div class="popup-times">${chips}</div><a href="${gmaps(g)}" target="_blank">${tr.maps}</a>`);markers.push(new maplibregl.Marker({element:el,anchor:"bottom"}).setLngLat([g.lng,g.lat]).setPopup(popup).addTo(map))}listEl.innerHTML=a.map((g,i)=>{const chips=g.times.map(x=>`<span class="chip ${state(x,g.city,now)}">${esc(x.a)}${x.d?"–"+esc(x.d):""}</span>`).join("");const ds=g.distance==null?"":`${Math.round(g.distance)} ${tr.from} · `;const note=g.st==="offday"?`<div class="meta">${g.city==="taipei"?tr.taipeiOff:tr.ntpcOff}</div>`:"";return`<div class="place-card" data-i="${i}"><div class="addr">${esc(g.place)}</div><div class="meta">${ds}${g.city==="taipei"?"Taipei":"New Taipei"}${g.district?" · "+esc(g.district):""}</div>${note}<div class="times">${chips}</div><a class="glink" href="${gmaps(g)}" target="_blank">${tr.maps}</a></div>`}).join("")||tr.none;[...listEl.querySelectorAll(".place-card")].forEach((el,i)=>el.onclick=e=>{if(e.target.closest("a"))return;let g=a[i];map.flyTo({center:[g.lng,g.lat],zoom:17});markers[i].togglePopup()});statusEl.textContent=`${a.length} ${tr.visible}${userPos?" · "+tr.nearest:""} · ${cache.size} ${tr.cached}`}
function applyLang(){let tr=T[lang];document.documentElement.lang=lang;locate.textContent=tr.locate;panelTitle.textContent=tr.panel;hint.textContent=tr.hint;lp.textContent=tr.past;ln.textContent=tr.now;lu.textContent=tr.up;lo.textContent=tr.off;render()}
async function init(){try{const defs=[{city:"taipei",url:"data/manifest.json",base:"data/"},{city:"new-taipei",url:"data/new-taipei/manifest.json",base:"data/new-taipei/"}];sources=await Promise.all(defs.map(async d=>({...d,manifest:await fetch(d.url,{cache:"force-cache"}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()})})));statusEl.textContent=T[lang].browse;await ensure()}catch(e){console.error(e);statusEl.textContent=T[lang].error;listEl.textContent=T[lang].error}}
map.on("load",init);map.on("moveend",ensure);map.on("zoomend",ensure);lang=document.getElementById("lang").value;document.getElementById("lang").onchange=e=>{lang=e.target.value;applyLang()};document.getElementById("locate").onclick=()=>{const tr=T[lang];if(!navigator.geolocation){statusEl.textContent=tr.blocked;return}statusEl.textContent=tr.getting;navigator.geolocation.getCurrentPosition(p=>{userPos={lat:p.coords.latitude,lng:p.coords.longitude};if(userMarker)userMarker.remove();const el=document.createElement("div");el.className="user-dot";userMarker=new maplibregl.Marker({element:el}).setLngLat([userPos.lng,userPos.lat]).addTo(map);map.flyTo({center:[userPos.lng,userPos.lat],zoom:16})},()=>statusEl.textContent=tr.blocked,{enableHighAccuracy:true,timeout:10000,maximumAge:0})};
</script></body></html>
