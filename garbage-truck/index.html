<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taiwan Garbage Truck Map | Study in Taiwan</title>
<meta name="description" content="Find Taipei garbage truck pickup times on a map. Browse without Mandarin search forms, or use your location to find nearby pickup points.">
<link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#fff}
#app{height:100%;display:grid;grid-template-rows:auto 1fr}header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid #ddd;background:#fff;z-index:3}
.brand{font-weight:700;margin-right:auto}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:9px 11px;border:1px solid #bbb;border-radius:9px;background:#fff}button{cursor:pointer}
#status{font-size:13px;color:#555;flex-basis:100%}#content{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px}#map{min-height:520px}#panel{overflow:auto;border-left:1px solid #ddd;background:#fff;padding:12px}
#panel h2{font-size:17px;margin:0 0 4px}.hint{font-size:12px;color:#666;margin-bottom:8px}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin:8px 0 10px}.legend span{display:flex;align-items:center;gap:5px}.dot{width:9px;height:9px;border-radius:50%}.dot.past{background:#9a9a9a}.dot.now{background:#18864b}.dot.upcoming{background:#2463eb}
.place-card{border-top:1px solid #eee;padding:10px 0}.place-card:first-of-type{border-top:0}.addr{font-size:13px;font-weight:700;line-height:1.35}.meta{font-size:12px;color:#666;margin-top:3px}.times{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{font-size:12px;border:1px solid #ccc;border-radius:999px;padding:3px 7px;background:#f7f7f7}.chip.past{color:#777;background:#f1f1f1;border-color:#d5d5d5}.chip.now{background:#18864b;color:#fff;border-color:#18864b}.chip.upcoming{background:#eaf0ff;color:#174bb8;border-color:#9db7ff}
.glink{display:inline-block;margin-top:6px;font-size:12px;text-decoration:none}.time-marker{padding:3px 6px;border-radius:6px;font:bold 12px/1.1 sans-serif;white-space:nowrap;border:1px solid #fff;box-shadow:0 1px 4px #0004;color:#fff}.time-marker.past{background:#8b8b8b}.time-marker.now{background:#18864b}.time-marker.upcoming{background:#2463eb}
.user-dot{width:18px;height:18px;border-radius:50%;background:#1677ff;border:3px solid #fff;box-shadow:0 0 0 2px #1677ff}.popup-times{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.popup-chip{border-radius:999px;padding:2px 6px;font-size:12px}.popup-chip.past{background:#eee;color:#777}.popup-chip.now{background:#18864b;color:#fff}.popup-chip.upcoming{background:#eaf0ff;color:#174bb8}
@media(max-width:800px){#content{grid-template-columns:1fr;grid-template-rows:minmax(430px,62vh) auto}#panel{border-left:0;border-top:1px solid #ddd}}
</style>
</head>
<body>
<div id="app">
<header>
<div class="brand">Garbage Truck Map</div>
<div class="controls"><button id="locate">Use my location</button><select id="lang" aria-label="Language"><option value="en">English</option><option value="id">Indonesia</option></select></div>
<div id="status">Loading map data…</div>
</header>
<div id="content">
<div id="map"></div>
<aside id="panel">
<h2 id="panelTitle">Visible pickup locations</h2>
<div class="hint" id="hint">All scheduled times are shown so you can also plan ahead. GPS is optional.</div>
<div class="legend"><span><i class="dot past"></i><b id="legendPast">Past today</b></span><span><i class="dot now"></i><b id="legendNow">Active now</b></span><span><i class="dot upcoming"></i><b id="legendUpcoming">Upcoming</b></span></div>
<div id="list">Move the map to browse Taipei.</div>
</aside>
</div>
</div>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script>
const T={
 en:{locate:"Use my location",panel:"Visible pickup locations",hint:"All scheduled times are shown so you can also plan ahead. GPS is optional.",intro:"Move or zoom the map. Nearby data loads automatically.",browse:"Move the map to browse Taipei.",noStops:"No scheduled pickup locations in this viewport.",openMaps:"Google Maps ↗",fromYou:"m from you",schedule:"scheduled time",schedules:"scheduled times",visible:"visible locations",nearest:"nearest first",getting:"Getting your location…",blocked:"Location blocked by browser. You can still browse the map manually.",unsupported:"Geolocation unsupported.",now:"NOW",loadError:"Could not load map data.",loading:"Loading nearby area…",past:"Past today",active:"Active now",upcoming:"Upcoming",cached:"grids cached"},
 id:{locate:"Gunakan lokasi saya",panel:"Titik pengambilan yang terlihat",hint:"Semua jam terjadwal tetap ditampilkan supaya bisa dipakai untuk merencanakan waktu buang sampah berikutnya. GPS tidak wajib.",intro:"Geser atau zoom peta. Data area sekitar dimuat otomatis.",browse:"Geser peta untuk menjelajahi Taipei.",noStops:"Tidak ada titik pengambilan terjadwal di area peta ini.",openMaps:"Google Maps ↗",fromYou:"m dari Anda",schedule:"jadwal",schedules:"jadwal",visible:"lokasi terlihat",nearest:"terdekat di atas",getting:"Mengambil lokasi Anda…",blocked:"Akses lokasi diblokir browser. Peta tetap bisa digunakan manual.",unsupported:"Browser tidak mendukung geolokasi.",now:"SEKARANG",loadError:"Data peta tidak bisa dimuat.",loading:"Memuat area sekitar…",past:"Sudah lewat hari ini",active:"Sedang aktif",upcoming:"Akan datang",cached:"grid tersimpan"}
};
let lang="en",manifest=null,userPos=null,userMarker=null,markers=[];
const tileCache=new Map(),inFlight=new Map();
const statusEl=document.getElementById("status"),listEl=document.getElementById("list");
const map=new maplibregl.Map({container:"map",style:"https://tiles.openfreemap.org/styles/liberty",center:[121.5319,25.0478],zoom:12.4});
map.addControl(new maplibregl.NavigationControl(),"top-left");
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes()}
function distM(a,b,c,d){const R=6371000,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p,q=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function gmaps(x){return`https://www.google.com/maps/search/?api=1&query=${x.y},${x.x}`}
function stateOf(t,now){if(t.dm<now)return"past";if(t.am<=now&&t.dm>=now)return"now";return"upcoming"}
function clearMarkers(){markers.forEach(m=>m.remove());markers=[]}
function overlaps(b,t){const[w,s,e,n]=t.bounds;return!(e<b.getWest()||w>b.getEast()||n<b.getSouth()||s>b.getNorth())}
function neededTiles(){if(!manifest)return[];const b=map.getBounds();return manifest.tiles.filter(t=>overlaps(b,t))}
async function loadTile(t){if(tileCache.has(t.id))return tileCache.get(t.id);if(inFlight.has(t.id))return inFlight.get(t.id);const p=fetch(`data/${t.file}`,{cache:"force-cache"}).then(r=>{if(!r.ok)throw new Error(`${t.id}:${r.status}`);return r.json()}).then(rows=>{tileCache.set(t.id,rows);inFlight.delete(t.id);return rows}).catch(e=>{inFlight.delete(t.id);throw e});inFlight.set(t.id,p);return p}
async function ensureViewportData(){const tiles=neededTiles(),missing=tiles.filter(t=>!tileCache.has(t.id));if(missing.length)statusEl.textContent=T[lang].loading;try{await Promise.all(missing.map(loadTile));renderViewport()}catch(e){console.error(e);statusEl.textContent=T[lang].loadError}}
function visibleGroups(){
 const b=map.getBounds(),now=nowMin(),groups=new Map();
 for(const t of neededTiles())for(const x of tileCache.get(t.id)||[]){
   if(x.x<b.getWest()||x.x>b.getEast()||x.y<b.getSouth()||x.y>b.getNorth())continue;
   const key=`${x.y.toFixed(6)},${x.x.toFixed(6)}|${x.p}`;
   if(!groups.has(key))groups.set(key,{place:x.p,lat:x.y,lng:x.x,times:[]});groups.get(key).times.push(x);
 }
 const out=[...groups.values()];
 for(const g of out){
   g.times.sort((a,b)=>a.am-b.am);
   g.active=g.times.find(t=>stateOf(t,now)==="now")||null;
   g.next=g.times.find(t=>stateOf(t,now)==="upcoming")||null;
   g.markerTime=g.active||g.next||g.times[g.times.length-1];
   g.markerState=stateOf(g.markerTime,now);
   g.distance=userPos?distM(userPos.lat,userPos.lng,g.lat,g.lng):null;
 }
 out.sort((a,b)=>userPos?(a.distance-b.distance):((a.markerTime?.am??9999)-(b.markerTime?.am??9999)));
 return out;
}
function renderViewport(){
 if(!map.loaded()||!manifest)return;
 clearMarkers();const groups=visibleGroups(),now=nowMin(),tr=T[lang];
 for(const g of groups){
   const el=document.createElement("div");el.className=`time-marker ${g.markerState}`;el.textContent=g.active?`${tr.now}→${g.active.d}`:g.markerTime.a;
   const chips=g.times.map(t=>`<span class="popup-chip ${stateOf(t,now)}">${esc(t.a)}–${esc(t.d)}</span>`).join("");
   const dist=g.distance==null?"":`<br><small>${Math.round(g.distance)} ${tr.fromYou}</small>`;
   const popup=new maplibregl.Popup({offset:18}).setHTML(`<b>${esc(g.place)}</b>${dist}<div class="popup-times">${chips}</div><a href="${gmaps({y:g.lat,x:g.lng})}" target="_blank" rel="noopener">${tr.openMaps}</a>`);
   markers.push(new maplibregl.Marker({element:el,anchor:"bottom"}).setLngLat([g.lng,g.lat]).setPopup(popup).addTo(map));
 }
 listEl.innerHTML=groups.map((g,i)=>{
   const chips=g.times.map(t=>`<span class="chip ${stateOf(t,now)}">${esc(t.a)}–${esc(t.d)}</span>`).join("");
   const d=g.distance==null?"":`${Math.round(g.distance)} ${tr.fromYou} · `,word=g.times.length===1?tr.schedule:tr.schedules;
   return`<div class="place-card" data-i="${i}"><div class="addr">${esc(g.place)}</div><div class="meta">${d}${g.times.length} ${word}</div><div class="times">${chips}</div><a class="glink" href="${gmaps({y:g.lat,x:g.lng})}" target="_blank" rel="noopener">${tr.openMaps}</a></div>`;
 }).join("")||tr.noStops;
 [...listEl.querySelectorAll(".place-card")].forEach((el,i)=>el.addEventListener("click",e=>{if(e.target.closest("a"))return;const g=groups[i];map.flyTo({center:[g.lng,g.lat],zoom:17});markers[i].togglePopup()}));
 statusEl.textContent=`${groups.length} ${tr.visible}${userPos?" · "+tr.nearest:""} · ${tileCache.size} ${tr.cached}`;
}
function applyLang(){const tr=T[lang];document.documentElement.lang=lang;document.getElementById("locate").textContent=tr.locate;document.getElementById("panelTitle").textContent=tr.panel;document.getElementById("hint").textContent=tr.hint;document.getElementById("legendPast").textContent=tr.past;document.getElementById("legendNow").textContent=tr.active;document.getElementById("legendUpcoming").textContent=tr.upcoming;renderViewport()}
async function init(){try{const r=await fetch("data/manifest.json",{cache:"force-cache"});if(!r.ok)throw new Error(r.status);manifest=await r.json();statusEl.textContent=T[lang].intro;await ensureViewportData()}catch(e){console.error(e);statusEl.textContent=T[lang].loadError;listEl.textContent=T[lang].loadError}}
map.on("load",init);map.on("moveend",ensureViewportData);map.on("zoomend",ensureViewportData);
document.getElementById("lang").addEventListener("change",e=>{lang=e.target.value;applyLang()});
document.getElementById("locate").addEventListener("click",()=>{const tr=T[lang];if(!navigator.geolocation){statusEl.textContent=tr.unsupported;return}statusEl.textContent=tr.getting;navigator.geolocation.getCurrentPosition(pos=>{userPos={lat:pos.coords.latitude,lng:pos.coords.longitude};if(userMarker)userMarker.remove();const el=document.createElement("div");el.className="user-dot";userMarker=new maplibregl.Marker({element:el}).setLngLat([userPos.lng,userPos.lat]).addTo(map);map.flyTo({center:[userPos.lng,userPos.lat],zoom:16})},()=>{statusEl.textContent=tr.blocked},{enableHighAccuracy:true,timeout:10000,maximumAge:0})});
</script>
</body></html>
