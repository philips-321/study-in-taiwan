const V2_OPTIONS=[["en", "English"], ["id", "Indonesia"], ["ko", "한국어"], ["ja", "日本語"], ["vi", "Tiếng Việt"], ["th", "ไทย"], ["hi", "हिन्दी"], ["fil", "Filipino"]];
const frame=document.getElementById("appFrame");

function patchV2(){
  const w=frame.contentWindow;
  const d=frame.contentDocument;
  if(!w||!d) return;
  try{
    w.eval(`Object.assign(T, ${JSON.stringify(V2_TRANSLATIONS)});`);
    const select=d.getElementById("lang");
    if(!select) throw new Error("Language selector not found");
    const current=select.value||"en";
    select.innerHTML="";
    for(const [value,label] of V2_OPTIONS){
      const option=d.createElement("option");
      option.value=value;
      option.textContent=label;
      select.appendChild(option);
    }
    select.value=V2_TRANSLATIONS[current]?current:"en";
    w.eval(`lang=${JSON.stringify(select.value)}; applyLang();`);
    d.documentElement.dataset.v2="multilingual";
  }catch(err){
    console.error("v2 language patch failed",err);
  }
}
frame.addEventListener("load",patchV2);
</script>
