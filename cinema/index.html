<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10151b">
  <meta name="description" content="Search Taiwan cinema showtimes by film, verified subtitles, audio language, city, and date.">
  <link rel="canonical" href="https://study-in-taiwan.com/cinema/">
  <title>Taiwan Cinema Map · Search Films by Subtitle and Audio</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://tiles.openfreemap.org">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="cinema.css?v=20261025q">
  <script defer src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <script defer src="cinema.js?v=20261025q"></script>
</head>
<body>
  <main class="app" data-sheet="half" data-map-visible="true">
    <section class="map-wrap" aria-label="Map of cinemas across Taiwan">
      <div id="map"></div>
      <a class="brand" href="../" aria-label="Study in Taiwan home"><span class="brand-icon">◉</span><span>TAIWAN<br><b>CINEMA MAP</b></span></a>
      <div class="map-caption"><span class="live-dot"></span><span id="map-caption">Cinema locations</span></div>
      <div class="map-tools" id="map-tools">
        <button class="map-tools-toggle" id="map-tools-toggle" type="button" aria-label="Map controls" aria-expanded="false" title="Map controls">⋯</button>
        <div class="map-tools-menu" id="map-tools-menu" hidden>
          <button type="button" id="map-zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
          <button type="button" id="map-zoom-out" aria-label="Zoom out" title="Zoom out">−</button>
          <button type="button" id="map-locate" aria-label="Use my location" title="Use my location">⌖</button>
        </div>
      </div>
      <div id="map-error" class="map-error" hidden>Map tiles unavailable. You can still browse cinemas from the list.</div>
      <div class="map-credit">Map © OpenStreetMap · OpenFreeMap</div>
    </section>
    <aside class="panel" id="panel">
      <div class="sheet-grab-row"><button class="sheet-grab" id="sheet-grab" type="button" aria-label="Expand cinema list"><span></span></button></div>
      <header class="panel-head">
        <div class="head-row">
          <div class="eyebrow" data-i18n="eyebrow">SCREENINGS ACROSS TAIWAN</div>
          <div class="head-actions">
            <label class="language-control"><span class="sr-only" data-i18n="language">Language</span><select id="language" aria-label="Language"><option value="en">EN</option><option value="zh-TW">繁中</option><option value="id">ID</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="vi">VI</option><option value="th">TH</option></select></label>
            <button class="icon-button" id="theme" type="button" aria-label="Switch to light mode" title="Switch theme">☼</button>
            <button class="icon-button map-view-toggle" id="map-view-toggle" type="button" aria-label="Hide map" title="Hide map">▣</button>
          </div>
        </div>
        <div class="control-strip">
          <label class="city-control"><span class="sr-only" data-i18n="city">City</span><select id="city" aria-label="City"><option value="all">All Taiwan</option></select><span class="chevron">⌄</span></label>
          <button class="locate-button" id="locate" type="button"><span aria-hidden="true">⌖</span><span data-i18n="locate">Use my location</span></button>
          <div class="date-nav">
            <button class="step-button" id="date-prev" type="button" aria-label="Previous available date">‹</button>
            <label class="date-select-wrap"><span class="sr-only" data-i18n="date">Showtime date</span><select id="date" aria-label="Showtime date"></select><span class="date-count" id="date-count"></span><span class="chevron">⌄</span></label>
            <button class="step-button" id="date-next" type="button" aria-label="Next available date">›</button>
          </div>
          <label class="filter-control"><span class="filter-label" data-i18n="subtitles">Subtitles</span><select id="subtitle-filter" aria-label="Subtitle language"></select><span class="chevron">⌄</span></label>
          <label class="filter-control"><span class="filter-label" data-i18n="audio">Audio</span><select id="audio-filter" aria-label="Audio language"></select><span class="chevron">⌄</span></label>
        </div>
        <label class="search"><span class="search-icon">⌕</span><span class="sr-only" data-i18n="search">Search films or cinemas</span><input id="search" type="search" placeholder="Search a movie or cinema…"><kbd>/</kbd></label>
        <div class="data-note" id="data-note"></div>
        <div class="summary"><span id="summary" data-i18n="loading">Loading cinemas…</span><button id="reset" type="button" data-i18n="reset">Reset</button></div>
      </header>
      <div class="results" id="results" aria-live="polite"><div class="loading"><span></span> Loading showtimes</div></div>
      <footer class="panel-foot"><span id="updated">Data from cinema schedules</span><span class="foot-mark">電影 · TAIWAN</span></footer>
    </aside>
  </main>
</body>
</html>
